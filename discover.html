<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<title>둘러보기 · WISH BOARD</title>
<!-- noindex: the page lists names and lines people chose to show (DISCOVER에 보이기); it is for visitors, not for search results. -->
<meta name="robots" content="noindex" />
<meta name="description" content="뉴욕 타임스퀘어를 본뜬 가상 광장에 지금 걸린 전광판과 오늘의 소원을 3D 없이 둘러봐요." />
<meta property="og:title" content="둘러보기 · WISH BOARD" />
<meta property="og:description" content="가상 타임스퀘어에 지금 걸린 전광판과 오늘의 소원을 둘러보세요." />
<meta property="og:image" content="https://studio.wishboard.workers.dev/og.jpg?v=4" />

<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" media="print" onload="this.media='all'" />
<style>
  /* The tokens of gift.html and index.html (2026-11-28, A. LED 전광판; test/style-tokens.test.mjs keeps them the same). */
  :root { --bg: #000000; --surface: #121212; --surface-2: #1c1c1c; --line: #2e2e2e; --line-strong: #444444; --text: #f7f5ee; --text-2: #c9c6bc; --muted: #9a978d; --dim: #9a978d; --accent: #ffb020; --accent-press: #c98a12; --on-accent: #1a1000; --accent-weak: rgba(255,176,32,.14); --live: #ff4436; --info: #48d6f0; --ok: #36d67e; --err: #ff7a85; --press: rgba(255,255,255,.24); --r: 4px; --r-sheet: 6px; }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
    font: 15px/1.55 "Pretendard Variable", Pretendard, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif; letter-spacing: -0.01em; word-break: keep-all; overflow-wrap: break-word; }
  main { max-width: 980px; margin: 0 auto; padding: max(14px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) calc(40px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
  a { color: var(--accent); }
  :is(a, button):focus-visible { outline: 2px solid var(--info); outline-offset: 2px; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 4px 0 10px; }
  .brand { font-weight: 900; font-size: 14px; line-height: 44px; color: var(--text); text-decoration: none; }
  .brand::before { content: ""; display: inline-block; width: 8px; height: 8px; margin: 0 8px 0 0; background: var(--accent); vertical-align: 1px; }
  .brand small { color: var(--muted); font-weight: 700; font-size: 12px; margin-left: 6px; }
  .tag { display: inline-block; padding: 2px 8px; border-radius: var(--r); font-size: 12px; font-weight: 900; background: var(--bg); color: var(--accent); border: 1px solid rgba(255,176,32,.5); }
  h1 { font-size: 24px; line-height: 1.3; margin: 6px 0 4px; font-weight: 900; letter-spacing: -0.035em; }
  h2 { font-size: 16px; margin: 22px 0 4px; font-weight: 900; }
  .sub { color: var(--muted); margin: 0 0 14px; font-size: 14px; }
  .fine { color: var(--dim); font-size: 12px; margin: 4px 0 10px; }
  .make { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 0 0 14px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 6px 14px; border-radius: var(--r); border: 1px solid var(--line-strong); background: var(--surface-2); color: var(--text); font: inherit; font-weight: 900; font-size: 15px; text-decoration: none; cursor: pointer; text-align: center; -webkit-tap-highlight-color: transparent; }
  .btn.gold { border-color: var(--accent); color: var(--on-accent); background: var(--accent); }
  .btn:active { background: var(--press); }
  .btn.gold:active { background: var(--accent-press); border-color: var(--accent-press); }
  .btn[aria-pressed=true] { border-color: var(--live); }
  .btn[aria-pressed=true] .ico { fill: var(--live); stroke: var(--live); }
  .ico { width: 1.25em; height: 1.25em; flex: none; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
  .btn:disabled { opacity: .5; cursor: default; }
  .tabs { display: flex; flex-wrap: wrap; gap: 8px; padding: 2px 2px 8px; margin: 0 -2px; } /* all six in sight (2026-11-28: on a 360-390px phone 개인 전광판 and 소원 sat past the edge with nothing to say so) */
  .tabs::-webkit-scrollbar { display: none; }
  .tab { flex: none; min-height: 44px; padding: 0 12px; border-radius: 0; border: 0; background: none; color: var(--text-2); font: inherit; font-weight: 800; font-size: 14px; cursor: pointer; } /* tabs, not pills: the chosen one underlined in amber */
  .tab[aria-selected=true] { color: var(--text); box-shadow: inset 0 -2px 0 var(--accent); }
  .tab:active { background: var(--press); }
  .tab:focus-visible { outline: 2px solid var(--info); outline-offset: 2px; }
  .grid { display: grid; grid-template-columns: 1fr; gap: 14px; }
  @media (min-width: 700px) { .grid { grid-template-columns: 1fr 1fr; } }
  .item { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px; }
  .grid > *, .make > * { min-width: 0; } /* a card's 640px canvas must not widen its column past the screen */
  .item canvas { display: block; width: 100%; max-width: 100%; height: auto; aspect-ratio: 16 / 9; border-radius: var(--r); }
  /* 16:9 is the least a card is: a long line grows it rather than being cut; the chip has a row of its own above the words. A board is a flat
     red board in a black frame (the gift card's 생일 colours, giftrules.js GIFT_THEMES.party), a wish the black board with amber words. */
  .face { aspect-ratio: 16 / 9; border-radius: var(--r); padding: 10px 14px 14px; display: flex; flex-direction: column; text-align: left; background: #b5121b; border: 4px solid #000; outline: 1px solid var(--line); }
  .face.wish { background: #000000; }
  .face .mid { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; padding: 6px 0; }
  .face .chip { align-self: flex-start; padding: 0; color: #ffffff; font-weight: 800; font-size: 12px; }
  .face .big { margin: 0; font-size: clamp(19px, 5.6vw, 26px); font-weight: 900; line-height: 1.2; letter-spacing: -0.035em; color: #ffe04a; } /* 5.2:1 on the red board */
  .face.wish .big, .face.wish .chip { color: var(--accent); }
  .face .line { margin: 6px 0 0; font-weight: 800; font-size: 15px; color: #ffffff; }
  .face .by { margin: 8px 0 0; font-size: 12px; font-weight: 700; color: #ffffff; }
  .acts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
  .acts .btn { min-height: 44px; font-size: 14px; }
  .note { color: var(--ok); font-size: 13px; font-weight: 800; margin: 6px 0 0; }
  .note:empty { display: none; }
  .empty { color: var(--muted); font-size: 14px; padding: 18px 4px; }
  .samples { margin-top: 8px; padding: 12px; border-radius: var(--r); border: 1px dashed var(--line-strong); }
  .samples h2 { margin-top: 0; }
  .badge { display: inline-block; margin: 8px 0 0; padding: 2px 8px; border-radius: var(--r); border: 1px solid var(--line-strong); color: var(--muted); font-size: 12px; font-weight: 800; }
  .foot { color: var(--dim); font-size: 12px; margin: 26px 0 0; text-align: center; }
</style>
</head>

<main id="app">
  <div class="top"><a class="brand" href="/">WISH BOARD<small>모두의 전광판</small></a><span class="tag">둘러보기</span></div>
  <h1>지금 가상 광장에 켜진 전광판</h1>
  <p class="sub">전광판과 오늘의 소원을 3D 없이 봐요. 불러오는 중…</p>
</main>
<script type="module" src="/discoverpage.js?v=202611281741"></script>
</body>
</html>
