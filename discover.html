<head>

<style>
  :root { --bg: #07061a; --card: rgba(255,255,255,.055); --stroke: rgba(255,255,255,.12); --text: #f3f1ff; --muted: #adabce; --dim: #a3a2c4; --gold: #ffcf5a; --gold2: #ffe9a8; --press: rgba(255,255,255,.24); --ok: #39f58a; --err: #ff8aa0; }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; min-height: 100vh; background: radial-gradient(900px 520px at 85% -10%, #3a1150 0%, transparent 60%), radial-gradient(800px 600px at -10% 10%, #14205a 0%, transparent 55%), var(--bg); color: var(--text);
    font: 15px/1.55 "Pretendard Variable", Pretendard, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif; letter-spacing: -0.01em; word-break: keep-all; overflow-wrap: break-word; }
  main { max-width: 980px; margin: 0 auto; padding: max(14px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) calc(40px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
  a { color: var(--gold); }
  :is(a, button):focus-visible { outline: 2px solid var(--gold2); outline-offset: 2px; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 4px 0 10px; }
  .brand { font-weight: 900; font-size: 13px; line-height: 44px; letter-spacing: .08em; color: var(--gold2); text-decoration: none; }
  .brand small { color: var(--muted); font-weight: 700; font-size: 12px; letter-spacing: 0; margin-left: 6px; }
  .tag { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 900; background: rgba(255,207,90,.16); color: var(--gold2); border: 1px solid rgba(255,207,90,.4); }
  h1 { font-size: 24px; line-height: 1.3; margin: 6px 0 4px; font-weight: 900; letter-spacing: -0.03em; }
  h2 { font-size: 16px; margin: 22px 0 4px; font-weight: 900; }
  .sub { color: var(--muted); margin: 0 0 14px; font-size: 14px; }
  .fine { color: var(--dim); font-size: 12px; margin: 4px 0 10px; }
  .make { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 0 0 14px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 48px; padding: 6px 14px; border-radius: 14px; border: 1px solid var(--stroke); background: rgba(255,255,255,.06); color: var(--text); font: inherit; font-weight: 900; font-size: 15px; text-decoration: none; cursor: pointer; text-align: center; -webkit-tap-highlight-color: transparent; }
  .btn.gold { border: 0; color: #2a1800; background: linear-gradient(135deg, var(--gold2), var(--gold) 45%, #e6a52a); }
  .btn:active { background: var(--press); }
  .btn.gold:active { box-shadow: inset 0 0 0 99px rgba(70,36,0,.34); }
  .btn[aria-pressed=true] { border-color: rgba(255,79,163,.75); }
  .btn:disabled { opacity: .5; cursor: default; }
  .tabs { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 8px; margin: 0 -2px; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { flex: none; min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--stroke); background: rgba(255,255,255,.04); color: var(--text); font: inherit; font-weight: 800; font-size: 14px; cursor: pointer; }
  .tab[aria-selected=true] { border-color: rgba(255,207,90,.85); background: rgba(255,207,90,.16); color: var(--gold2); }
  .tab:active { background: var(--press); }
  .tab:focus-visible { outline: 2px solid var(--gold2); outline-offset: 2px; }
  .grid { display: grid; grid-template-columns: 1fr; gap: 14px; }
  @media (min-width: 700px) { .grid { grid-template-columns: 1fr 1fr; } }
  .item { background: var(--card); border: 1px solid var(--stroke); border-radius: 18px; padding: 10px; }
  .grid > *, .make > * { min-width: 0; } /* a card's 640px canvas must not widen its column past the screen */
  .item canvas { display: block; width: 100%; max-width: 100%; height: auto; aspect-ratio: 16 / 9; border-radius: 12px; }
  /* 16:9 is the least a card is: a long line grows it rather than being cut; the chip has a row of its own above the words. */
  .face { aspect-ratio: 16 / 9; border-radius: 12px; padding: 10px 14px 14px; display: flex; flex-direction: column; text-align: center; background: linear-gradient(135deg, #ff4fa3, #5b21ff); box-shadow: inset 0 0 0 3px rgba(255,224,138,.8); }
  .face.wish { background: linear-gradient(135deg, #312e81, #020617); }
  .face .mid { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 6px 0; }
  .face .chip { align-self: flex-start; padding: 3px 10px; border-radius: 999px; background: rgba(8,6,28,.6); color: #ffffff; font-weight: 800; font-size: 12px; }
  .face .big { margin: 0; font-size: clamp(19px, 5.6vw, 26px); font-weight: 900; line-height: 1.25; color: #ffe08a; text-shadow: 0 1px 2px rgba(20,4,40,.85), 0 0 1px rgba(20,4,40,.9); } /* gold on the pink corner is under 3:1 by itself */
  .face .line { margin: 6px 0 0; font-weight: 800; font-size: 15px; color: #ffffff; }
  .face .by { margin: 8px 0 0; font-size: 12px; font-weight: 700; color: #ffffff; }
  .acts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
  .acts .btn { min-height: 44px; font-size: 14px; }
  .note { color: var(--ok); font-size: 13px; font-weight: 800; margin: 6px 0 0; }
  .note:empty { display: none; }
  .empty { color: var(--muted); font-size: 14px; padding: 18px 4px; }
  .samples { margin-top: 8px; padding: 12px; border-radius: 18px; border: 1px dashed rgba(255,255,255,.28); }
  .samples h2 { margin-top: 0; }
  .badge { display: inline-block; margin: 8px 0 0; padding: 2px 10px; border-radius: 999px; border: 1px solid var(--stroke); color: var(--muted); font-size: 12px; font-weight: 800; }
  .foot { color: var(--dim); font-size: 12px; margin: 26px 0 0; text-align: center; }
</style>
</head>
