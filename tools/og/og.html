<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>og.jpg source (1200 x 630)</title>
<!-- The source of /og.jpg, the link-preview picture. Build: node tools/build-og.mjs (serves the repo root, so /icons and /giftart.js resolve).
     The board is painted by the product's own giftart.js, so the picture shows what a 선물 전광판 really looks like.
     2026-11-28 (A. LED 전광판): true black, the marquee amber, one flat board on a capture of the 3D plaza at night (icons/street.jpg), the
     ticker band along the foot. No glow, gradient, reflection or tilted cards. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<style>
  html, body { margin: 0; background: #000; }
  #card { position: relative; width: 1200px; height: 630px; overflow: hidden; background: #000; color: #f7f5ee;
    font-family: "Pretendard Variable", Pretendard, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif; }
  .bg { position: absolute; top: 0; right: 0; width: 640px; height: 566px; background: url(/icons/street.jpg) 50% 50% / cover no-repeat; }
  .bg::after { content: ""; position: absolute; inset: 0; background: rgba(0,0,0,.35); }
  .copy { position: absolute; left: 64px; top: 92px; width: 520px; }
  .brand { display: flex; align-items: center; gap: 12px; font-size: 26px; font-weight: 900; color: #f7f5ee; }
  .brand i { width: 16px; height: 16px; background: #ffb020; }
  h1 { margin: 34px 0 0; font-size: 92px; line-height: 1.05; font-weight: 900; letter-spacing: -.035em; }
  .sub { margin: 28px 0 0; font-size: 33px; line-height: 1.4; font-weight: 600; color: #c9c6bc; }
  .sub b { font-weight: 800; color: #ffb020; }
  .board { position: absolute; left: 640px; top: 150px; width: 504px; height: 284px; }
  .board canvas { display: block; width: 100%; height: 100%; }
  .ticker { position: absolute; left: 0; right: 0; bottom: 0; height: 64px; background: #000; border-top: 1px solid #2e2e2e;
    display: flex; align-items: center; padding: 0 64px; font-size: 26px; font-weight: 800; color: #ffb020; white-space: nowrap; }
</style>
</head>
<body>
<div id="card">
  <div class="bg"></div>
  <div class="copy">
    <div class="brand"><i></i>WISH BOARD</div>
    <h1>모두의<br />전광판</h1>
    <p class="sub">친구 이름이나 내 다짐을<br /><b>가상 타임스퀘어</b> 전광판에.<br />6시간 무료예요.</p>
  </div>
  <div class="board"><canvas id="c1" width="1024" height="576"></canvas></div>
  <div class="ticker">거리 전광판 68곳 · 6시간 무료 · 15초 축하 영상 · 친구들의 롤링페이퍼 · WISH BOARD</div>
</div>
<script type="module">
  import { paintGift, GIFT_SANS } from '/giftart.js';
  // A sample board. The name is made up; the words are the product's own occasion line.
  const G = { id: 'og-main', to: '민지', from: '지수', occ: 'bday', msg: '태어나 줘서 고마워!', n: 3 };
  window.ogReady = (async () => {
    const text = 'To. From. 친구 메시지 개 WISH BOARD 선물 전광판 생일 축하해요 ' + G.to + G.from + G.msg + '0123456789';
    // Canvas text does not start a font download by itself: ask for the weights the board uses first.
    try { await Promise.all([700, 800, 900].map((w) => document.fonts.load(`${w} 40px ${GIFT_SANS}`, text))); } catch { /* the system font draws instead */ }
    try { await document.fonts.ready; } catch { /* same */ }
    await new Promise((res) => { const im = new Image(); im.onload = im.onerror = res; im.src = '/icons/street.jpg'; });
    paintGift(document.getElementById('c1'), G);
    await new Promise((res) => requestAnimationFrame(() => requestAnimationFrame(res)));
    return document.fonts.check('800 40px "Pretendard Variable"') ? 'pretendard' : 'fallback font';
  })();
</script>
</body>
</html>
