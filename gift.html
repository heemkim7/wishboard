<style>
  :root { --bg: #07061a; --card: rgba(255,255,255,.055); --stroke: rgba(255,255,255,.12); --text: #f3f1ff; --muted: #a8a6c9; --dim: #77769c; --gold: #ffcf5a; --gold2: #ffe9a8; --pink: #ff4fa3; --ok: #39f58a; --err: #ff8aa0; --r: 18px; }

    font: 15px/1.55 "Pretendard Variable", Pretendard, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif; letter-spacing: -0.01em; }

  .note p { margin: 0; font-weight: 700; word-break: keep-all; overflow-wrap: anywhere; }
