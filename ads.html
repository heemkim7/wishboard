<html lang="ko">
<head>
<meta charset="utf-8" />

<title>광고 안내 · WISH BOARD</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<style>
  :root {
    --bg: #0a0e1c; --surface: #141a2e; --surface-2: #1c2440; --line: #262d47; --line-strong: #3a4266;
    --text: #f2f4ff; --text-2: #b9bfdc; --muted: #8f96b8; --dim: #666d92;
    --accent: #ffb020; --accent-press: #eba21d; --on-accent: #1c1300; --accent-weak: rgba(255, 176, 32, .14);
    --info: #48d6f0; --ok: #3ddc97; --danger: #ff5d6c;
    --font: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
    --focus: 0 0 0 2px var(--bg), 0 0 0 4px var(--info);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); }
  body { min-height: 100vh; background: radial-gradient(900px 420px at 50% -120px, rgba(255,176,32,.12), transparent 70%), var(--bg); }
  main { max-width: 720px; margin: 0 auto; padding: max(20px, env(safe-area-inset-top)) 16px calc(48px + env(safe-area-inset-bottom)); }
  a { color: var(--accent); }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .brand { font-weight: 900; letter-spacing: .02em; font-size: 14px; color: var(--text-2); }
  .brand b { color: var(--accent); }
  .back { font-size: 13px; font-weight: 700; color: var(--text-2); text-decoration: none; border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; white-space: nowrap; }
  h1 { margin: 22px 0 6px; font-size: clamp(24px, 7vw, 32px); line-height: 1.25; letter-spacing: -.02em; }
  h2 { margin: 34px 0 10px; font-size: 18px; }
  p { line-height: 1.65; color: var(--text-2); margin: 8px 0; }
  .lede { font-size: 15px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; margin: 10px 0; }
  .chip { display: inline-block; font-size: 12px; font-weight: 800; color: var(--on-accent); background: var(--accent); border-radius: 6px; padding: 1px 7px; vertical-align: 1px; }
  .muted { color: var(--muted); font-size: 13px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; }
  .stat b { display: block; font-size: 26px; color: #ffe2a8; font-variant-numeric: tabular-nums; }
  .stat span { font-size: 13px; color: var(--text-2); }
  .prod h3 { margin: 0 0 4px; font-size: 16px; }
  .prod .price { margin-top: 8px; font-weight: 900; color: var(--accent); font-size: 18px; }
  .prod .price small { font-weight: 700; color: var(--muted); font-size: 12px; }
  .map { display: block; width: 100%; max-width: 360px; height: auto; margin: 0 auto; }
  .screens { display: grid; gap: 6px; margin: 10px 0 0; padding: 0; list-style: none; }
  .screens li { display: flex; gap: 10px; align-items: baseline; font-size: 14px; color: var(--text-2); }
  .screens li b { color: var(--text); min-width: 22px; }
  ol.steps, ul.steps { margin: 6px 0 0; padding-left: 20px; color: var(--text-2); line-height: 1.8; }
  form { display: grid; gap: 14px; }
  label, fieldset > legend { font-size: 14px; font-weight: 700; color: var(--text); }
  fieldset { border: 0; padding: 0; margin: 0; display: grid; gap: 8px; }
  .row { display: grid; gap: 10px; grid-template-columns: 1fr 1fr; }
  .field { display: grid; gap: 6px; min-width: 0; }
  input[type=text], input[type=email], input[type=tel], input[type=url], input[type=date], input[type=number], select, textarea {
    width: 100%; min-height: 46px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line-strong); background: var(--surface-2); color: var(--text); font: inherit; font-size: 16px; }
  textarea { min-height: 84px; resize: vertical; }
  input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible, a:focus-visible { outline: none; box-shadow: var(--focus); }
  .opts { display: grid; gap: 8px; }
  .opt { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface-2); font-weight: 600; font-size: 14px; color: var(--text-2); }
  .opt input { margin-top: 3px; accent-color: var(--accent); }
  .opt b { color: var(--text); }
  .count { font-size: 12px; color: var(--muted); font-weight: 600; justify-self: end; }
  .err { color: var(--danger); font-size: 13px; font-weight: 700; min-height: 0; }
  .agree { font-size: 13px; line-height: 1.6; color: var(--text-2); background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
  .agree label { display: flex; gap: 10px; align-items: flex-start; margin-top: 8px; }
  .agree input { margin-top: 3px; accent-color: var(--accent); width: 18px; height: 18px; flex: none; }
  .hp { position: absolute; left: -10000px; width: 1px; height: 1px; overflow: hidden; }
  button.go { min-height: 52px; border: 0; border-radius: 14px; background: var(--accent); color: var(--on-accent); font: inherit; font-weight: 900; font-size: 16px; cursor: pointer; }
  button.go:active { background: var(--accent-press); }
  button.go:disabled { opacity: .55; cursor: default; }
  .preview { border-radius: 12px; border: 1px solid var(--line-strong); background: linear-gradient(135deg, #0b1030, #140c26); aspect-ratio: 16 / 9; display: grid; place-items: center; text-align: center; position: relative; padding: 12px; overflow: hidden; }
  .preview .chip { position: absolute; left: 10px; top: 10px; }
  .preview .l1 { font-size: clamp(18px, 5.4vw, 26px); font-weight: 900; color: #eef0fb; }
  .preview .l2 { font-size: clamp(13px, 3.6vw, 16px); font-weight: 700; color: #b9bfdc; }
  .preview .l3 { font-size: clamp(12px, 3.2vw, 14px); font-weight: 700; color: var(--accent); }
  .preview .em { font-size: 28px; }
  .done { text-align: center; }
  .done h2 { margin-top: 10px; }
  footer { margin-top: 40px; font-size: 13px; color: var(--muted); line-height: 1.7; }
  @media (max-width: 380px) { .row { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <div class="top">
    <span class="brand"><b>WISH BOARD</b> · 모두의 전광판</span>
    <a class="back" href="./">광장으로</a>
  </div>
  <div id="app"><p class="muted">불러오는 중…</p></div>
  <footer>
    <a href="./?policy=terms">이용약관</a> · <a href="./?policy=privacy">개인정보처리방침</a><br>
    광고 화면은 광장의 일반 전광판과 따로 있어요. 응원 포인트로 살 수 없고, 신청과 운영자 승인으로만 걸립니다.<br>
    광고는 게임 속 가상 광장에만 나가요. 이 광장은 뉴욕 타임스퀘어에서 영감을 받아 만든 가상 공간입니다. 실제 타임스퀘어와 그곳의 건물·단체·광고와는 관계가 없습니다.
  </footer>
</main>

</body>
</html>
