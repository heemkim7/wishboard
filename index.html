  .taxihud { position: absolute; left: 50%; bottom: calc(18px + var(--safe-b)); transform: translateX(-50%); display: grid; grid-template-columns: auto auto 1fr; grid-template-rows: auto auto; gap: 6px 18px; align-items: center; padding: 12px 18px; min-width: min(560px, calc(100vw - 24px)); pointer-events: auto !important; }

  .taxihud .spd b { font: 800 28px/1 var(--font); letter-spacing: -.01em; color: var(--text); min-width: 2.2ch; text-align: right; font-variant-numeric: tabular-nums; }
  .taxihud .spd span { font-size: 12px; font-weight: 700; color: var(--muted); }
  .taxihud .meter { padding: 6px 10px; border-radius: 10px; background: var(--bg); border: 1px solid var(--line); }
  .taxihud .meter small { display: block; font: 700 12px/1 var(--font); letter-spacing: .04em; color: var(--muted); }
  .taxihud .meter b { display: block; margin-top: 3px; font: 800 17px/1 var(--font); color: var(--accent); font-variant-numeric: tabular-nums; }
  .taxihud .job { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .taxihud .job .arrow, .waypill .arrow { display: inline-block; font-style: normal; font-size: 20px; color: var(--info); transition: transform .15s linear; }
  .taxihud .job small { display: block; font-size: 12px; font-weight: 700; color: var(--muted); white-space: nowrap; }
  .taxihud .job b { display: block; font-size: 20px; font-weight: 800; }
  .taxihud .job .time { margin-left: auto; font: 800 20px/1 var(--font); color: var(--text); font-variant-numeric: tabular-nums; }
  .taxihud .job .time.low { color: var(--danger); animation: chipPulse .6s infinite; }
  .taxihud .keys { grid-column: 1 / -1; font-size: 12px; font-weight: 500; color: var(--muted); text-align: center; }
  .waypill { position: absolute; left: 50%; top: calc(88px + var(--safe-t)); transform: translateX(-50%); display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 14px; border-radius: 999px; font-size: 13px; font-weight: 700; color: var(--info); pointer-events: auto !important; }
  .waypill .arrow { font-size: 17px; color: var(--info); }
  .waypill small { color: var(--muted); font-size: 12px; margin-left: 2px; }
  /* The guide pill's inside (ui.js wayPill / paintWay): .arrow, then .way (the place's .name over .sub: the distance and .go,
     what a tap on the pill does), then the ✕ (small).
     .go reads 자동으로 가기 (auto-walk), or 자동 on an upright phone narrower than 412px, whose lane has no room for more (under
     360px the arrow goes too). While the avatar walks to the target by itself the pill is `going`: 멈추기, a lit rim, no arrow.
     .name is one line and is cut with an ellipsis where the lane ends; with a name (`named`) the two lines are 12px.
     Only the ✕ clears the guide: its target is 44 x 44px, centred on it (it overhangs the 38px pill by 3px above and below). */
  .waypill .way { display: inline-flex; flex-direction: column; align-items: flex-start; justify-content: center; min-width: 0; line-height: 1.2; text-align: left; }
  .waypill .name { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); font-size: 12px; font-weight: 800; }
  .waypill .sub { display: inline-flex; align-items: baseline; gap: 6px; white-space: nowrap; }
  .waypill.named .sub { font-size: 12px; }
  .waypill .go { color: var(--text); font-weight: 800; }
  .waypill .go i { font-style: normal; }
  .waypill.going { border-color: var(--info); }
  .waypill.going .go { color: var(--info); }
  .waypill.going .arrow { display: none; }
  .waypill small { position: relative; flex: none; align-self: stretch; display: inline-flex; align-items: center; justify-content: center; width: 30px; margin: 0 -10px 0 -2px; }
  .waypill small::after { content: ''; position: absolute; left: 50%; top: 50%; width: 44px; height: 44px; transform: translate(-50%, -50%); }
  /* A tap on the pill starts the walk: on touch the whole pill takes taps 44px tall (3px over and under its 38px). It is
     ::before, so the ✕ (small, positioned after it) stays on top of it and keeps its own taps. */
  html.touch .waypill::before { content: ''; position: absolute; inset: -3px 0; }
  @media (orientation: portrait) and (max-width: 411px) { html.touch .waypill .go i { display: none; } }
  @media (orientation: portrait) and (max-width: 359px) { html.touch .waypill .arrow { display: none; } }
  .taxihud .job small { white-space: normal; }
  .taxihud .job.talk small { color: var(--text); font-size: 15px; line-height: 1.35; }
  #ui > .sponsor { pointer-events: auto; position: absolute; left: 50%; bottom: calc(128px + var(--safe-b)); transform: translateX(-50%); width: min(520px, calc(100% - 24px)); padding: 14px 16px 12px; z-index: 8; }
  .sponsor h3 { margin: 0; font: 800 17px/1.3 var(--font); letter-spacing: -.01em; }
  .sponsor p { margin: 6px 0 0; font-size: 13px; font-weight: 500; line-height: 1.45; }
  .sponsor .gold { display: block; margin-top: 8px; color: var(--accent); }
  .sponsor h3, .sponsor p { overflow-wrap: anywhere; }
  .sponsor .input { width: 100%; margin-top: 8px; }
  .sponsor .row { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; position: static; width: auto; height: auto; }
  .sponsor .row .btn { width: 100%; height: 44px; border-radius: 10px; justify-content: center; white-space: nowrap; }
  /* Touch: the card is a piece of the floating stack (ui.js; see "The floating stack"). It used to be 148px up and 8px in
     from both edges, over 멍때리기, 동작 and the pouch (and 시점 해제 lay on its phrase chips). The chips are one row that
     scrolls sideways, so the card stays about 150px tall on a narrow phone instead of wrapping to five rows. */
  html.touch .toasts > .sponsor { pointer-events: auto; width: min(420px, calc(100% + 60px)); padding: 12px 14px; }
  html.touch .toasts > .sponsor .chips { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; overscroll-behavior-x: contain; }
  html.touch .toasts > .sponsor .chips::-webkit-scrollbar { display: none; }
  html.touch .toasts > .sponsor .chips button { flex: none; white-space: nowrap; }
  .act.boost { font-size: 20px; color: var(--text); background: var(--surface-hud); }

  /* ---------- 같이 춤추기 (ui.js danceEl): a strip while dancing, not a panel ----------
     One line: ♪ the track · 지금 N명이 같이 춰요 · 그만 추기 (38px tall, its taps 44px, like the waypoint pill). It covers
     nothing of the 3D view but its own line and hides nothing: the stick and the right-hand buttons stay (moving ends the
     dance). A desktop window has it over the dock; touch has it in the bottom lane the prompt tag uses (the tag is down
     while dancing); an upright phone has it over the stick, as two lines of text beside the button. */
  .dancebar { position: absolute; left: 50%; bottom: calc(116px + var(--safe-b)); transform: translateX(-50%); display: flex; align-items: center; gap: 12px; min-height: 44px; max-width: calc(100% - 24px - var(--safe-l) - var(--safe-r)); padding: 3px 3px 3px 16px; border-radius: 999px; pointer-events: auto !important; z-index: 4; }
  .dancebar[hidden] { display: none; }
  .dancebar .txt { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
  .dancebar .song { font: 800 13px/1.25 var(--font); color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dancebar .mates { font: 700 12px/1.25 var(--font); color: var(--text-2); white-space: nowrap; }
  .dancebar .stop { position: relative; flex: none; height: 38px; padding: 0 14px; border-radius: 999px; font: 700 13px/1 var(--font); color: var(--text); background: var(--surface-2); border: 1px solid var(--line-strong); white-space: nowrap; }
  .dancebar .stop::after { content: ''; position: absolute; inset: -3px 0; }

  /* ---------- full map / settings ---------- */
  .sheet.map { width: min(1180px, 100%); }
  .bigmap { position: relative; width: 100%; height: min(70vh, 760px); border-radius: 14px; overflow: hidden; border: 1px solid var(--line); background: var(--bg); }
  .bigmap canvas { width: 100%; height: 100%; display: block; cursor: crosshair; touch-action: none; }
  .mapzoom { position: absolute; right: 12px; top: 12px; display: flex; flex-direction: column; gap: 6px; }
  .mapzoom button { width: 40px; height: 40px; border-radius: 10px; font-size: 15px; font-weight: 800; color: var(--text); background: var(--surface-hud); border: 1px solid var(--line); }
  .mapzoom button:last-child { font-size: 12px; }
  .legend { display: flex; flex-wrap: wrap; gap: 8px 16px; margin-top: 12px; font-size: 12px; font-weight: 700; color: var(--muted); align-items: center; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
  .legend .tip { margin-left: auto; color: var(--muted); }
  .legend .osm { color: var(--muted); font-size: 12px; text-decoration: none; }
  /* The quick-jump row scrolls sideways and fades at its right end, which says there is more to scroll to. */
  .quick { display: flex; gap: 6px; overflow-x: auto; padding: 0 24px 10px 0; scrollbar-width: none; -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 28px), transparent); mask-image: linear-gradient(90deg, #000 calc(100% - 28px), transparent); }
  .quick::-webkit-scrollbar { display: none; }
  .quick button { position: relative; flex: none; height: 32px; padding: 0 12px; border-radius: 999px; font-size: 12px; font-weight: 700; color: var(--text-2); background: var(--surface-2); border: 1px solid var(--line); white-space: nowrap; }
  .quick button:hover { border-color: var(--line-strong); color: var(--text); }
  .place { margin: 4px 0 12px; padding: 12px 14px; border-radius: 14px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; background: var(--surface-2); border: 1px solid var(--line); }
  .place .where { flex: 1 1 260px; min-width: 0; }
  .place .where b { display: block; font-size: 15px; font-weight: 800; color: var(--text); }
  .place .where span { display: block; margin-top: 3px; font-size: 12px; font-weight: 500; color: var(--muted); }
  .place .go { display: flex; gap: 6px; flex-wrap: wrap; }
  .place .go .btn { height: 36px; padding: 0 12px; font-size: 13px; }
  .place .mine { flex-basis: 100%; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .place .mine small { font-size: 12px; font-weight: 700; color: var(--muted); margin-right: 2px; }
  .chip-btn { height: 30px; padding: 0 10px; border-radius: 999px; font-size: 12px; font-weight: 700; color: var(--text-2); background: var(--surface-2); border: 1px solid var(--line); }
  .plot.mine { outline: 2px solid var(--text); outline-offset: 1px; }
  .plot.mine::after { content: "내 땅"; position: absolute; top: 3px; font-size: 12px; font-weight: 800; color: var(--text); }
  .rangerow { display: flex; align-items: center; gap: 14px; }
  .rangerow b { min-width: 48px; text-align: right; font-size: 15px; color: var(--text); font-variant-numeric: tabular-nums; }
  .range { flex: 1; -webkit-appearance: none; appearance: none; height: 6px; border-radius: 999px; background: var(--line-strong); outline: none; }
  .range::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%; background: var(--text); cursor: pointer; }
  .range::-moz-range-thumb { width: 22px; height: 22px; border-radius: 50%; background: var(--text); border: 0; cursor: pointer; }
  .linkbtn { position: relative; color: var(--info); font-weight: 700; text-decoration: underline; }

  /* ---------- news ---------- */
  /* The news line (속보) has the slot to itself (the 5-minute draw line that shared it is gone: WISH BOARD has no lottery).
     It shows for 4.4 s, longer while a long line crawls. Where the slot is, per screen, is in the blocks "Desktop top-centre
     column" and "Touch bottom lane" below. */
  .news { position: absolute; top: calc(68px + var(--safe-t)); left: calc(378px + var(--safe-l)); right: calc(222px + var(--safe-r)); width: auto; max-width: 440px; height: 40px; margin: 0 auto; min-width: 0; transform: translateY(-8px); transition: transform .35s cubic-bezier(.16,1,.3,1), opacity .25s ease; opacity: 0; display: flex; align-items: stretch; overflow: hidden; pointer-events: none; }
  .news.show { transform: none; opacity: 1; }
  #ui > .news.show.go { pointer-events: auto; cursor: pointer; }
  .news .kick { flex: none; display: grid; place-items: center; padding: 0 14px; font: 800 12px/1.1 var(--font); letter-spacing: .04em; color: var(--bg); background: var(--live); text-align: center; }
  .news .kick b { display: block; font-size: 15px; letter-spacing: 0; }
  /* Centred in the fixed-height bar, so the two lines never run past its bottom edge. */
  .news .body { --pad: 16px; padding: 0 var(--pad); min-width: 0; flex: 1; display: flex; flex-direction: column; justify-content: center; overflow: hidden; }
  .news .body small { display: block; font-size: 12px; font-weight: 700; line-height: 1.2; color: var(--live); letter-spacing: .04em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .news .body strong { display: block; margin-top: 3px; font-size: 15px; font-weight: 500; line-height: 1.2; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .news .body em { font-style: normal; font-weight: 700; color: var(--text); }
  /* A line longer than the bar crawls once from its start to its end (ui.js pumpNews sets --crawl and --crawl-s and holds
     the line until it has been read), instead of ending in "…". Reduced motion keeps the "…". */
  .news.crawl .body { -webkit-mask-image: linear-gradient(90deg, transparent, #000 var(--pad), #000 calc(100% - var(--pad)), transparent); mask-image: linear-gradient(90deg, transparent, #000 var(--pad), #000 calc(100% - var(--pad)), transparent); }
  .news.crawl .body strong { width: max-content; overflow: visible; text-overflow: clip; animation: newsCrawl var(--crawl-s, 3s) linear 1s both; }
  @keyframes newsCrawl { from { transform: none; } to { transform: translateX(var(--crawl, 0px)); } }

  /* ---------- prompt / dock ---------- */
  .prompt { position: absolute; left: 50%; bottom: calc(118px + var(--safe-b)); transform: translate(-50%, 12px) scale(.96); opacity: 0; transition: all .25s cubic-bezier(.2,1.2,.4,1); pointer-events: none !important; }
  .prompt.show { opacity: 1; transform: translate(-50%, 0) scale(1); pointer-events: auto !important; }
  .prompt button { display: flex; align-items: center; gap: 12px; padding: 9px 18px 9px 9px; border-radius: 999px; font-weight: 700; font-size: 15px; max-width: min(520px, calc(100vw - 24px)); }
  .prompt button > span { white-space: normal; }
  .keycap { min-width: 32px; height: 32px; padding: 0 8px; border-radius: 10px; display: inline-grid; place-items: center; font: 800 13px/1 var(--font); color: var(--text); background: var(--surface-2); border: 1px solid var(--line-strong); }
  .prompt .sub { font-size: 12px; color: var(--muted); font-weight: 500; }
  .prompt .cool { position: relative; width: 26px; height: 26px; }
  .prompt .cool svg { position: absolute; inset: 0; transform: rotate(-90deg); }
  /* A tap on a far board: a small card, never a sheet. ui.js showFarCard removes it after 4 s. */
  .farcard { position: relative; transform: translateY(8px); display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; width: max-content; max-width: 100%; padding: 10px 12px; border-radius: 14px; background: var(--surface-hud); border: 1px solid var(--line); color: var(--text); opacity: 0; transition: opacity .25s ease, transform .25s ease; pointer-events: none !important; }
  .farcard.show { opacity: 1; transform: none; pointer-events: auto !important; }
  /* It is the bottom of the floating stack (.toasts, see "The floating stack"): above the prompt and the waypoint pill,
     under any toasts, as wide as the stack allows. The name and state keep at least 140px; when that and the buttons do
     not fit on one row, the buttons wrap to a second row on the right. As its own box at left: 50% it could never be
     wider than half the screen, so on a phone the name shrank to nothing and only the buttons showed. */
  .farcard .where { display: grid; gap: 2px; flex: 1 1 140px; min-width: 0; }
  .farcard .where b { font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .farcard .where span { font-size: 12px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* The card's own button row is .far-acts: the touch controls' .acts rules (absolute, bottom right, no pointer events) must never match it. */
  .farcard .far-acts { display: flex; flex-direction: row; align-items: center; gap: 6px; flex: none; margin-left: auto; pointer-events: auto; }
  .farcard .far-acts button { min-height: 40px; padding: 0 12px; border-radius: 14px; border: 1px solid var(--line); background: transparent; color: var(--text); font-size: 13px; font-weight: 700; white-space: nowrap; }
  .farcard .far-acts button.go { border-color: var(--accent); color: var(--accent); }
  .farcard .far-acts button:disabled { color: var(--text-2); opacity: .5; }
  /* Touch: 44px targets with 8px sides (3 x 44px + 2 x 6px = 144px, so the row fits a 175px stack on a phone on its side). */
  html.touch .farcard .far-acts button { min-width: 44px; min-height: 44px; padding: 0 8px; }

  .dock { position: absolute; left: 50%; bottom: calc(18px + var(--safe-b)); transform: translateX(-50%); display: flex; gap: 8px; padding: 8px; pointer-events: auto !important; }
  /* An ad screen's card (ui.js showAdCard, a .farcard): the 광고 disclosure in front of the advertiser's line. */
  .farcard .where b .adtag { display: inline-block; font-size: 12px; font-weight: 800; color: var(--on-accent); background: var(--accent); border-radius: 6px; padding: 0 6px; vertical-align: 1px; white-space: nowrap; }
  .emote { position: relative; width: 74px; height: 70px; border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: var(--text); background: var(--surface-2); border: 1px solid transparent; transition: transform .15s, background .2s, border-color .2s; }
  .emote:hover { border-color: var(--line-strong); transform: translateY(-2px); }
  .emote:active { transform: translateY(0) scale(.96); }
  .emote .e { font-size: 28px; line-height: 1; }
  .emote .l { font-size: 12px; font-weight: 700; color: var(--text-2); }
  .emote .k { position: absolute; top: 5px; right: 6px; font: 700 12px/1 var(--font); color: var(--muted); }
  .emote.fire { animation: fire .45s ease; }
  @keyframes fire { 30% { transform: translateY(-6px) scale(1.06); background: var(--line-strong); } }
  .dock .sep { width: 1px; margin: 8px 2px; background: var(--line); }
  .emote.more.on { border-color: var(--line-strong); background: var(--accent-weak); color: var(--accent); }
  /* 같이 춤추기 in the touch 동작 panel: a whole row under the four actions, like the pouch row above them. */
  html.touch .reacts button.dance-go { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; width: auto; height: 44px; padding: 0 12px; border-radius: 10px; font: 700 14px/1.2 var(--font); color: var(--text); background: var(--surface-2); border: 1px solid var(--line); }
  html.touch .reacts button.dance-go svg.ico { width: 22px; height: 22px; color: var(--accent); }
  .reacts { position: absolute; left: 50%; bottom: calc(112px + var(--safe-b)); transform: translateX(-50%); display: grid; grid-template-columns: repeat(8, 46px); gap: 6px; padding: 10px; pointer-events: auto !important; animation: fadeIn .2s ease; box-shadow: var(--shadow-pop); }
  @keyframes fadeIn { from { opacity: 0; } }
  .reacts button { width: 46px; height: 46px; border-radius: 10px; font-size: 28px; background: var(--surface-2); border: 1px solid transparent; transition: transform .12s, border-color .2s; }
  .reacts button:hover { transform: translateY(-2px) scale(1.06); border-color: var(--line-strong); }

  .help { position: absolute; left: calc(14px + var(--safe-l)); bottom: calc(18px + var(--safe-b)); padding: 10px 12px; display: grid; grid-template-columns: auto auto; gap: 6px 10px; font-size: 12px; color: var(--muted); font-weight: 500; transition: opacity .6s; }
  .help kbd { font: 700 12px/1 var(--font); color: var(--text); padding: 4px 6px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); }
  .help.fade { opacity: 0; }

  /* ---------- touch controls ---------- */
  .joy { position: absolute; left: calc(22px + var(--safe-l)); bottom: calc(26px + var(--safe-b)); width: 132px; height: 132px; border-radius: 50%; pointer-events: auto !important; touch-action: none;
    background: var(--surface-hud); border: 1px solid var(--line); }
  .joy::before { content: ""; position: absolute; inset: 22px; border-radius: 50%; border: 1px dashed var(--line-strong); }
  .joy .knob { position: absolute; left: 50%; top: 50%; width: 56px; height: 56px; margin: -28px 0 0 -28px; border-radius: 50%; background: var(--text-2); transition: transform .08s; }
  .acts { position: absolute; right: calc(20px + var(--safe-r)); bottom: calc(28px + var(--safe-b)); display: flex; flex-direction: column; align-items: flex-end; gap: 12px; pointer-events: none; }
  .act { pointer-events: auto; width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; font-size: 20px; color: var(--text); background: var(--surface-hud); border: 1px solid var(--line); touch-action: manipulation; }
  .act.big { width: 84px; height: 84px; font-size: 15px; font-weight: 800; line-height: 1.1; text-align: center; color: var(--on-accent); background: var(--accent); border-color: transparent; }
  .act.jump { font-size: 28px; font-weight: 700; color: var(--text); background: var(--surface-hud); }
  /* Floating stick (ui.js joyZone, interact.js STICK_*): the lower-left area takes the touch and sits under the rest of
     the HUD; the stick is only a picture, resting faint until a thumb drags, then centred where it went down. */
  #ui > .joyzone { position: absolute; left: 0; bottom: 0; z-index: 0; pointer-events: auto; touch-action: none; }
  html.touch #ui > .joy { pointer-events: none !important; opacity: .5; transition: opacity .15s; }
  html.touch #ui > .joy.live { opacity: 1; }
  .joy.live .knob { transition: none; }
  .act.jump.honk { font-size: 15px; font-weight: 800; }
  /* The look-around hint (touch only: ui.js coachEl) is the bottom of the floating stack (.toasts, see "The floating
     stack"): above the waypoint pill, under the toasts, on the bottom lane's centre. It used to keep its own centre
     (16px … right 76px, 30px left of the toasts and 55px left of the lane at 390px). One line of 12px; on a phone on its
     side under 641px wide (a 175px stack) its two halves are two lines. While a far-board card, the 홈 화면 추가 card or
     a board's card is in the stack, it steps aside. */
  .coach { padding: 8px 12px; border-radius: 999px; background: var(--surface-hud); border: 1px solid var(--line); color: var(--text); font: 700 12px/1.35 var(--font); text-align: center; white-space: nowrap; pointer-events: none; }
  .toasts:has(> .farcard, > .a2hs:not([hidden]), > .sponsor:not([hidden])) > .coach { display: none; }
  /* A far-board card answers a tap: for its 4 s the 홈 화면 추가 card steps aside too, so the stack stays short. */

  html.touch .quick button::after, html.touch .sheet .more .emo-row button::after, html.touch .sheet .more .swatch::after,
  html.touch .reacts button::after, html.touch .wallet .chip::after,

  html.touch .quick { padding-top: 6px; margin-top: -6px; }

  /* One column under 900px, scrolling as a whole. Only the preview stays in view while the player types: the first
     column is laid out as if its box were not there (display: contents), so its tabs, slot picker, place card and stats

    /* Two notices (a tappable one and a plain one, two lines each) fit between the left column and the stick: tighter rows
       here (2 x 46px + 6px from 112px down ends 210px down, the stick starts 236px down at 360px tall), and on a 320px tall
       phone 12px rows (44 + 4 + 38px from 108px down end 194px down, the stick starts 196px down). */
    html.touch .toasts { gap: 6px; }
    html.touch .toast { padding: 6px 12px; line-height: 1.3; }
    @media (max-height: 340px) {
      html.touch .toasts { gap: 4px; }
      html.touch .toast { padding: 3px 10px; font-size: 12px; line-height: 1.25; }
    }
    /* The tag is level with the action button (30 … 82px up) and at most 240px wide, so it no longer covers the street. */
    html.touch .prompt { left: calc(106px + var(--safe-l)); bottom: calc(38px + var(--safe-b)); max-width: 240px; }
    html.touch .stay-focus { bottom: calc(34px + var(--safe-b)); }
    /* The board's card without the board's lines (the camera is on the board). */
    html.touch .toasts > .sponsor { padding: 8px 12px; }
    html.touch .toasts > .sponsor h3 { font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    html.touch .toasts > .sponsor p { display: none; }
    html.touch .toasts > .sponsor .chips { margin-top: 6px; }
    /* The far-board card would need two rows (108px) in a 300px stack and reach the stick. For its 4 s it takes the tag's
       place instead, one row right against the column, and the tag steps aside. */
    html.touch .toasts > .farcard { position: fixed; left: calc(106px + var(--safe-l)); right: calc(72px + var(--safe-r)); bottom: calc(30px + var(--safe-b)); width: auto; max-width: 420px; margin: 0 0 0 auto; padding: 8px 10px; flex-wrap: nowrap; }
    html.touch body:has(.toasts > .farcard) #ui > .prompt { visibility: hidden; }
    /* Under 641px wide the band between the left column and the icon row is narrower than the pill: there it sits above
       the tag, right against the column (the jump button is beside it, not under it). */
    @media (max-width: 640px) { html.touch .waypill { top: auto; bottom: calc(92px + var(--safe-b)); left: auto; right: calc(72px + var(--safe-r)); margin: 0; } html.touch .news { right: calc(196px + var(--safe-r)); } }
    /* The ⋯ menu: three columns, so it is about 210px tall on a 375px screen (it took 302px). */
    html.touch .tools.open { grid-template-columns: repeat(3, minmax(0, 1fr)); width: min(440px, calc(100vw - 20px - var(--safe-l) - var(--safe-r))); }
  }

  /* ---------- UI pass (2026-11-24): what every control shares ---------- */
  /* Pressed. Every control answers a press at a glance: lighter (a white veil that works on any background, plus
     brightness for the ones that are a picture) and a touch smaller. ui.js also keeps .tapped on the control for 160 ms
     from pointerdown, because :active ends with a quick tap before the eye has seen it (and iOS only applies :active
     where a touch listener exists). The amber buttons go darker instead (--accent-press, 1.5:1 against --accent), and a
     colour swatch only shrinks: it must keep its colour. `scale` (not transform) so a control's own transform stays. */
  html :is(button, [role="button"], summary, a.btn, label.agree):not(:disabled, [aria-disabled="true"]):is(:active, .tapped) { filter: brightness(1.25); box-shadow: inset 0 0 0 100vmax rgba(255, 255, 255, .16); scale: .97; transition: none; }
  html :is(.btn.gold, .btn.primary, .act.big, .enter-go):not(:disabled):is(:active, .tapped) { filter: none; box-shadow: none; background: var(--accent-press); scale: .96; }
  html button:is(.swatch, .theme):not(:disabled):is(:active, .tapped) { filter: none; box-shadow: none; scale: .88; }
  a[href]:not(.btn):active { opacity: .6; }
  #ui > .news.go:active { filter: brightness(1.25); }

  /* The big call to action in a sheet is the tallest button of its sheet on every screen. Under 641px the .btn rule
     (38px, 13px text) used to win over .cta, so 로그인 / 저장하기 / 보내기 were smaller than the ghost buttons beside them. */
  html.touch .sheet .cta { height: auto; min-height: 48px; padding-top: 10px; padding-bottom: 10px; font-size: 16px; line-height: 1.3; white-space: normal; text-align: center; }
  @media (max-width: 640px) { .sheet .cta { height: auto; min-height: 48px; font-size: 16px; } }
  /* A button that stands alone on its row in a sheet is as wide as the sheet's column (some were as wide as their text). */
  html.touch .sheet .content > .btn:not(.icon), .sheet.narrow .content > .btn:not(.icon) { display: flex; width: 100%; justify-content: center; }
  /* A sheet's box is focused when it opens so the keyboard starts inside it; that focus draws no ring around the sheet. */
  html div.sheet:not(#view):focus-visible { box-shadow: var(--shadow-sheet) !important; }
  /* Thumb-sized on touch: a fold's summary line, the shop row in the profile sheet, the two wish tabs, a tappable notice. */
  .sheet .more summary { padding: 4px 0; }
  .linkbtn, .legend .osm { display: inline-flex; align-items: center; justify-content: center; min-height: 24px; }
  html.touch .sheet .more summary { padding: 13px 0; }
  html.touch .toasts > .sponsor .chips button { min-height: 44px; padding: 7px 14px; font-size: 13px; }
  html.touch .swatches input[type=color] { width: 44px; height: 44px; }
  html.touch .sheet .more .swatches input[type=color] { width: 40px; height: 40px; }
  html.touch .sheet .btn.shop-open { height: auto; min-height: 44px; }
  html.touch .wish-tab { min-height: 44px; }
  html.touch .wish-tabs { gap: var(--tap-gap); }
  html.touch .toast.hit { min-height: 44px; }
  html.touch .legend .osm { display: inline-flex; align-items: center; min-height: 44px; }
  /* Sliders: the track is 6px in a taller box, so the thumb can be caught anywhere along a 44px row on touch. */
  .range { height: 28px; background: none; }
  .range::-webkit-slider-runnable-track { height: 6px; border-radius: 999px; background: var(--line-strong); }
  .range::-webkit-slider-thumb { margin-top: -8px; }
  .range::-moz-range-track { height: 6px; border-radius: 999px; background: var(--line-strong); }
  html.touch .range { height: 44px; }

  /* Map sheet: 44px buttons 8px apart; the quick-jump row fades at its right end, which says there is more to scroll to. */
  html.touch .mapzoom { gap: 8px; }
  html.touch .mapzoom button { width: 44px; height: 44px; }
  .mapzoom button.wide, html.touch .mapzoom button.wide { width: auto; padding: 0 10px; gap: 4px; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; white-space: nowrap; }
  .mapzoom { align-items: flex-end; }
  html.touch .quick { gap: 8px; }
  html.touch .quick button { height: 36px; }
  html.touch .quick button::after { inset: -4px 0; }

  /* Colour swatches: 40px circles everywhere (they were 32-38px), and the free colour picker is a circle like them. */
  .swatch { width: 40px; height: 40px; position: relative; }
  html.touch .swatch::after { content: ""; position: absolute; inset: -4px; }
  .swatches input[type=color]::-webkit-color-swatch-wrapper { padding: 0; }
  .swatches input[type=color]::-webkit-color-swatch { border: 0; border-radius: 50%; }
  .swatches input[type=color]::-moz-color-swatch { border: 0; border-radius: 50%; }
  .sheet .more .swatch { width: 32px; height: 32px; }
  .sheet .more .swatches input[type=color] { width: 32px; height: 32px; }
  html.touch .sheet .more .swatch::after { inset: -6px; }

  /* A checkbox row: a 22px box with its words right beside it, on a 44px row. Links never sit inside the row's label
     (a tap meant for the box used to open the terms): they are their own line under it (.agree-links). */
  .agree { min-height: 44px; align-items: center; gap: 12px; margin-top: 8px; }
  .agree input { width: 22px; height: 22px; margin: 0; }
  .agree-links { display: flex; flex-wrap: wrap; gap: 4px 20px; margin: 8px 0 0 34px; font-size: 13px; }
  .agree-links .linkbtn { min-height: 32px; }
  html.touch .agree-links .linkbtn::after { inset: -6px -8px; }
  /* Links in running text take the app's link colour (a bare <a> was the browser's #0000ee, 1.84:1 on the sheet). */
  .note a, .callout a, .credits a { color: var(--info); font-weight: 700; }
  /* A row of link buttons (the settings sheet's map credit, licences, terms, privacy; a photo's licence and source). */
  .linkrow { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
  .linkrow > :is(a, button) { display: flex; align-items: center; justify-content: center; min-height: 44px; padding: 6px 10px; border-radius: 10px; font: 700 13px/1.3 var(--font); color: var(--text-2); background: var(--surface-2); border: 1px solid var(--line); text-align: center; text-decoration: none; cursor: pointer; }
  .credits .c .linkrow { margin-top: 8px; }
  /* Settings: a row that opens another sheet (its name, then a chevron), and the 소리 / 전체 화면 switches. */
  .rowlist { display: grid; gap: 8px; margin-top: 12px; }
  .rowlist > button { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; min-height: 48px; padding: 0 12px 0 14px; border-radius: 10px; font: 700 15px/1.3 var(--font); color: var(--text); background: var(--surface-2); border: 1px solid var(--line); text-align: left; cursor: pointer; }
  .rowlist > button > span { flex: 1; min-width: 0; }
  .rowlist > button > em { flex: none; font-style: normal; font-size: 13px; font-weight: 700; color: var(--text-2); }
  .rowlist > button svg.ico { color: var(--text-2); }
  .rowlist > .switch > i { flex: none; position: relative; width: 44px; height: 26px; border-radius: 13px; background: var(--line-strong); transition: background-color .15s; }
  .rowlist > .switch > i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--text); transition: translate .15s; }
  .rowlist > .switch[aria-pressed="true"] > i { background: var(--accent); }
  .rowlist > .switch[aria-pressed="true"] > i::after { translate: 18px 0; background: var(--on-accent); }
  .rowlist > .switch[aria-pressed="true"] > em { color: var(--accent); }
  .idline { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 500 14px/1.4 var(--font); color: var(--text-2); }

  /* The plot levels: a level not reached yet is dimmed by its picture, not by fading its name under 4.5:1. */
  .lv, .lv.done { opacity: 1; }
  .lv .i { opacity: .5; }
  .lv.done .i { opacity: .85; }
  .lv.cur .i, .lv.next .i { opacity: 1; }
  .lv .t { color: var(--text-2); }

  /* A field's title row: the name stays on one line and the note beside it wraps (the name used to break one letter a line). */
  .field > label { gap: 10px; white-space: nowrap; }
  .field > label > span { min-width: 0; white-space: normal; text-align: right; }
  .field > .note { margin-top: 6px; }
  /* The identity row's name ends in "…" when it does not fit (.name is a flex row, where text-overflow does nothing). */
  .profile .name > span { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  /* 지금 할 일: a line breaks between words, never inside one. */
  #ui .nextgoal.task { word-break: keep-all; }

  /* The bake panel: the title on one line with its three marks under it, ✕ to close, and the zones are told by colour
     (the GOOD and GOLD words ran into each other on a phone). */
  .bake header { align-items: flex-start; }
  .bake h3 { white-space: nowrap; }
  .bake .marks { display: block; margin-top: 6px; font: 700 15px/1 var(--font); letter-spacing: .12em; color: var(--text-2); }
  .bake .x { flex: none; }
  html.touch .bake .stop { width: 100%; height: 52px; justify-content: center; font-size: 17px; }
  /* A closed game panel is out of the tab order and the accessibility tree (ui.js also sets inert on it). */
  .bake:not(.show) { visibility: hidden; }

  /* Short screens (a phone on its side, a desktop window at 200%). */
  /* 응원 순위 (.sheet.steady): the tab row never shrinks (it was squeezed to 10px with a 0px list under it), and under
     521px the fixed-height frame is dropped: the sheet scrolls as a whole and the list keeps at least three rows. */
  .sheet.steady .seg { flex: none; }
  /* A list with nothing in it but its one line of text does not hold the sheet at full height (288px stood empty). */
  .sheet.steady:has(.ranks > .note:only-child) { height: auto; }
  .sheet.steady .ranks:has(> .note:only-child) { flex: none; }
  @media (max-height: 520px) {
    .sheet.steady { display: block; height: auto; max-height: calc(var(--app-h, 100dvh) - 20px); overflow: auto; }
    .sheet.steady .content { display: block; overflow: visible; }
    .sheet.steady .ranks { min-height: 132px; overflow: visible; }
    .sheet.steady .ranks:has(> .note:only-child) { min-height: 0; }
    /* A photo sheet: the photo is as tall as leaves its buttons on the first screen. */
    .shot-preview { width: auto; max-width: 100%; max-height: calc(var(--app-h, 100dvh) - 200px); margin: 0 auto; }
    /* A board preview in a narrow sheet is at most 120px tall, so the fields under it start on the first screen. */
    .sheet:not(.bill) .screen canvas { width: auto; max-width: 100%; height: min(120px, 28vh); margin: 0 auto; }
  }
  /* Short and wide (640px+): the claim wizard and the billboard sheet are two columns, the preview on the left staying
     in view, the fields and the buttons on the right. */
  @media (max-height: 520px) and (min-width: 640px) {
    .sheet.wiz { width: min(820px, 100%); }
    .sheet.wiz .content:has(> .screen) { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); column-gap: 18px; align-items: start; }
    .sheet.wiz .content:has(> .screen) > .screen { grid-column: 1; grid-row: 1 / span 12; position: sticky; top: 0; margin-top: 0; }
    .sheet.wiz .content:has(> .screen) > :not(.screen) { grid-column: 2; }
    .sheet.wiz .content:has(> .screen) > :nth-child(2) { margin-top: 0; }
    .sheet.wiz .screen canvas { width: 100%; height: auto; }
    .sheet.bill .grid2.bb { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); gap: 18px; overflow: hidden; }
    .sheet.bill .grid2.bb > :first-child { display: block; min-height: 0; overflow: auto; }
    .sheet.bill .grid2.bb > :last-child { min-height: 0; overflow: auto; margin-top: 0; }
    .sheet.bill .grid2.bb .screen { position: static; padding: 6px; border-radius: 14px; background: var(--bg); }
    .sheet.bill .grid2.bb .screen canvas { width: 100%; height: auto; }
    .sheet.bill .holder { grid-template-columns: 1fr 1fr; }
  }
  /* A desktop window 520px tall or less (a 1280 x 760 window at 200% is 640 x 380): the left column is the identity card
     alone, with the 응원 포인트 amount in it as on a phone (a tap opens the wallet sheet), and the dock is one compact row
     along the bottom. The prompt used to lie on the wallet chips, a toast on the guest pill, and the dock stood as a
     column whose top button was off the screen. */
  @media (max-height: 520px) {
    html:not(.touch) .hud-l > :not(.ident) { display: none; }
    html:not(.touch) .ident .id-coin { display: flex; align-items: center; gap: 4px; flex: none; padding: 0 12px 0 8px; border: 0; border-left: 1px solid var(--line); background: none; color: var(--accent); font: 800 15px/1 var(--font); cursor: pointer; pointer-events: auto; }
    html:not(.touch) .id-coin img { width: 24px; height: 24px; clip-path: circle(34%); object-fit: cover; filter: brightness(1.35) saturate(1.3); }
    html:not(.touch) .id-coin .pend { padding: 0 4px; border-radius: 999px; background: var(--accent-weak); font-size: 12px; font-weight: 700; line-height: 14px; }
    html:not(.touch) .dock { left: 50%; right: auto; bottom: calc(10px + var(--safe-b)); transform: translateX(-50%); flex-direction: row; padding: 4px; gap: 4px; }
    html:not(.touch) .dock .emote, html:not(.touch) .dock .stay-lounge-btn { width: 50px; height: 44px; }
    html:not(.touch) .dock .emote :is(.l, .k), html:not(.touch) .dock .stay-lounge-btn .l { display: none; }
    html:not(.touch) .dock .sep { width: 1px; height: auto; margin: 6px 2px; }
    html:not(.touch) .prompt { bottom: calc(70px + var(--safe-b)); }
    html:not(.touch) .reacts { left: 50%; right: auto; bottom: calc(70px + var(--safe-b)); transform: translateX(-50%); grid-template-columns: repeat(8, 44px); }
    html:not(.touch) .reacts button { width: 44px; height: 44px; font-size: 20px; }
    html:not(.touch) .toasts { bottom: calc(132px + var(--safe-b)); }
    html:not(.touch) .help { display: none; }
  }
  /* And under 641px wide, where the 속보 line and the waypoint pill run along the bottom: they go above the dock row. */
  @media (max-height: 520px) and (max-width: 640px) {
    html:not(.touch) .news { bottom: calc(70px + var(--safe-b)); }
    html:not(.touch) .waypill { bottom: calc(116px + var(--safe-b)); }
    html:not(.touch) .prompt { bottom: calc(162px + var(--safe-b)); }
    html:not(.touch) .toasts { bottom: calc(222px + var(--safe-b)); }
  }

  /* Desktop: rows that are buttons are at least 24px tall (WCAG 2.2 target size; they were 15-19px). */
  html:not(.touch) .liveboard :is(.livehead, button.rank, button.f), html:not(.touch) .todo-card :is(.todo-head, .todo-row), html:not(.touch) .wallet .nextgoal:not(.task) { min-height: 24px; }
  /* A touch tablet keeps the full left column: its rows that are buttons are 32px tall there. */
  html.touch .liveboard :is(.livehead, button.rank, button.f), html.touch .todo-card .todo-row:not(.big) { min-height: 32px; }
  /* Desktop tool row (2026-11-24, the owner: "some have text and some do not; make them one"). From 1024px every tool in
     the row carries its name beside the icon, in the order of use (overlay.js TOOL_ORDER); the ones that do not fit at
     that width are in ⋯ (더보기), which opens a menu of every tool as an icon + name row, as on a phone. Inline from:
     1024px 전광판 걸기, 선물 전광판, 오늘의 소원, 응원 순위, 받은 소식 (while unread); 1280px + 사진 찍어 공유, 공유;
     1440px + 내 건물, 조작 안내; 1680px + 전체 화면, 설정, and no ⋯. Under 1024px the row is icons only, all of them
     (820-1023px) or folded (under 820px): one form either way. It used to be four named pills and seven bare icons. */
  @media (min-width: 1024px) {
    html:not(.touch) .bar { position: relative; min-height: 46px; }
    html:not(.touch) .tools { gap: 4px; }
    html:not(.touch) .tools > .btn { width: auto; padding: 0 12px 0 10px; gap: 6px; border-radius: 999px; font-size: 13px; font-weight: 700; line-height: 1; }
    html:not(.touch) .tools > .btn::after { content: attr(aria-label); white-space: nowrap; }
    html:not(.touch) .tools > .tool-gift::after { content: "선물 전광판"; }
    html:not(.touch) .tools > .tool-fold { display: inline-flex; }
    html:not(.touch) .tools > .tool-fold::after { content: "더보기"; }
    html:not(.touch) .tools > .btn :is(.wish-dot, .inbox-dot) { top: 4px; right: 4px; }
    html:not(.touch) .tools:not(.open) > :is(.t-1280, .t-1440, .t-1680) { display: none; }
    /* Open: one column of rows over the minimap, the same tools in the same order, ⋯ becomes 닫기 at the bottom. */
    html:not(.touch) .tools.open { position: absolute; top: 0; right: 0; z-index: 9; display: grid; grid-template-columns: 1fr; gap: 2px; width: 220px; height: auto; padding: 6px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line-strong); box-shadow: var(--shadow-sheet); }
    html:not(.touch) .tools.open > .btn { display: inline-flex; width: 100%; height: 40px; justify-content: flex-start; border-radius: 12px; }
    html:not(.touch) .tools.open > .tool-fold::after { content: "닫기"; }
    html:not(.touch) .tools.open :is(.wish-dot, .inbox-dot) { position: static; order: 1; flex: none; margin-left: -2px; outline: 0; }
  }
  @media (min-width: 1280px) { html:not(.touch) .tools:not(.open) > .t-1280 { display: inline-flex; } }
  @media (min-width: 1440px) { html:not(.touch) .tools:not(.open) > .t-1440 { display: inline-flex; } }
  @media (min-width: 1680px) { html:not(.touch) .tools:not(.open) > .t-1680 { display: inline-flex; } html:not(.touch) .tools:not(.open) > .tool-fold { display: none; } }
  /* The board's card over the dock (a desktop window): its phrase chips are one row that scrolls, as on touch. */
  #ui > .sponsor .chips { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: thin; }
  #ui > .sponsor .chips button { flex: none; white-space: nowrap; }
  /* Profile sheet in a desktop window up to 800px tall: smaller character pictures and tighter rows, so 저장하기 is on the
     first screen (at 1280 x 760 it was cut by the sheet's bottom edge). */
  .sheet .colors { gap: 8px; }
  @media (max-height: 800px) {
    html:not(.touch) .species-grid .pic { max-width: 44px; }
    html:not(.touch) .species-grid button { min-height: 56px; }
    html:not(.touch) .sheet.narrow .field { margin-top: 10px; }
    html:not(.touch) .sheet.narrow .cta { height: 48px; }
    html:not(.touch) .sheet.narrow .content { padding-bottom: 18px; }
  }
  html.touch #ui.newbie .newbie-more { min-height: 44px; }
  /* ---------- Sheet spacing (2026-11-24, the owner: "the board sheet's sticker and link buttons are stuck together") ----------
     One rhythm in every sheet: buttons, chips, tabs and swatches next to each other are --tap-gap apart (8px with a mouse,
     12px on touch), and a group of them stands --group-gap (16px) under what is above it. A sheet's button row (.row) had
     no rule at all, so 링크 열기 · 이 전광판 보기 · 빈 전광판 찾기 · 신고 and the four 네온 스티커 touched (0px); chips were 6px
     apart with a mouse, tabs and the lot grid 4-6px. The buttons of one row share one height and wrap as a group. */
  :root { --tap-gap: 8px; --group-gap: 16px; }
  html.touch { --tap-gap: 12px; }
  .sheet .row { display: grid; grid-template-columns: repeat(auto-fit, minmax(112px, 1fr)); align-items: stretch; gap: var(--tap-gap); margin-top: var(--group-gap); }
  .sheet .row > .btn { width: 100%; justify-content: center; margin: 0; }
  .sheet .field > .row { margin-top: 0; }
  .sheet :is(.chips, .seg, .place .go, .themes, .swatches, .colors, .plots, .species-grid, .wish-tabs, .shot-row, .wiz-nav, .wal-quick, .linkrow, .rowlist, .lines, .emo-row, .quick, .mapzoom, .login-form, .team-form, .vipcard .air-row) { gap: var(--tap-gap); }
  .sheet :is(.chips, .holder, .field) { margin-top: var(--group-gap); }
  /* Buttons stacked straight in a sheet (Google로 계속 over the terms links, 로그인 over 처음이면 가입, a card's field and button). */
  .sheet .content > .btn, .sheet .vipcard :is(.btn, .input) { margin-top: max(10px, var(--tap-gap)); }
