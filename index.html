<!doctype html>

<title>타임스퀘어 K-점령전 · Times Square K-Takeover</title>

<style>
  :root {
    --bg: #070a16;
    --glass: rgba(13, 17, 38, .56);
    --glass-strong: rgba(10, 13, 30, .8);
    --glass-hi: rgba(255, 255, 255, .06);
    --stroke: rgba(255, 255, 255, .11);
    --stroke-hi: rgba(255, 255, 255, .22);
    --gold: #ffcf5a;
    --gold-2: #ffe9a8;
    --gold-deep: #c8901a;
    --magenta: #ff3d9a;
    --magenta-2: #ff7ac0;
    --cyan: #3fe6ff;
    --green: #39f5a0;
    --red: #ff3b4e;
    --text: #f4f6ff;
    --muted: #9aa3c7;
    --dim: #6b7398;
    --radius: 18px;
    --blur: blur(16px) saturate(150%);
    --font: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
    --display: "Black Han Sans", "Pretendard Variable", Pretendard, sans-serif;
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-l: env(safe-area-inset-left, 0px);
    --safe-r: env(safe-area-inset-right, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: var(--font); }
  body { overflow: hidden; overscroll-behavior: none; -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none; }
  input, textarea, select { user-select: text; -webkit-user-select: text; }
  #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
  #ui { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
  #ui > * { pointer-events: none; }
  button, input, select { font-family: inherit; color: inherit; }
  button { cursor: pointer; border: 0; background: none; padding: 0; }
  [hidden] { display: none !important; }
  .tnum { font-variant-numeric: tabular-nums; }

  .glass {
    background: linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,.015)), var(--glass);
    border: 1px solid var(--stroke);
    box-shadow: 0 18px 40px -18px rgba(0,0,0,.65), inset 0 1px 0 rgba(255,255,255,.08);
    backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
    border-radius: var(--radius);
  }
  .live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 3px rgba(57,245,160,.18), 0 0 12px var(--green); flex: none; }
  .live-dot.warn { background: var(--gold); box-shadow: 0 0 0 3px rgba(255,207,90,.18), 0 0 12px var(--gold); }
  .live-dot.off { background: var(--dim); box-shadow: none; }

  /* ---------- HUD ---------- */
  .hud-l { position: absolute; top: calc(14px + var(--safe-t)); left: calc(14px + var(--safe-l)); display: flex; flex-direction: column; gap: 10px; width: 272px; }
  .profile { pointer-events: auto; display: flex; align-items: center; gap: 12px; padding: 10px 12px; cursor: pointer; transition: border-color .2s, transform .2s; }
  .profile:hover { border-color: var(--stroke-hi); }
  .avatar { width: 40px; height: 40px; border-radius: 13px; flex: none; position: relative; display: grid; place-items: center; font-size: 20px;
    background: radial-gradient(circle at 30% 25%, rgba(255,255,255,.55), transparent 45%), var(--me, var(--magenta));
    box-shadow: 0 6px 18px -6px var(--me, var(--magenta)), inset 0 -3px 0 rgba(0,0,0,.25); }
  .profile .who { min-width: 0; flex: 1; }
  .profile .name { font-weight: 800; font-size: 15px; letter-spacing: -.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 6px; }
  .profile .name small { font-size: 11px; font-weight: 700; color: var(--muted); }
  .profile .status { margin-top: 3px; display: flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 600; color: var(--muted); }
  .profile .edit { font-size: 12px; color: var(--muted); padding: 6px 8px; border-radius: 10px; background: var(--glass-hi); }

  .wallet { pointer-events: auto; padding: 12px 14px 12px 12px; display: flex; align-items: center; gap: 12px; position: relative; overflow: hidden; }
  .wallet::after { content: ""; position: absolute; inset: 0; background: linear-gradient(110deg, transparent 30%, rgba(255,233,168,.12) 45%, transparent 60%); transform: translateX(-100%); animation: sheen 5.5s ease-in-out infinite; pointer-events: none; }
  @keyframes sheen { 0%, 70% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
  .coin-icon { width: 38px; height: 38px; border-radius: 50%; flex: none; position: relative;
    background: radial-gradient(circle at 35% 30%, #fff6cf 0 12%, #ffd86b 32%, #e6a52a 64%, #a8700f 100%);
    box-shadow: 0 0 0 2px rgba(255,233,168,.35), 0 6px 18px -4px rgba(255,190,60,.7), inset 0 -3px 4px rgba(120,70,0,.5); display: grid; place-items: center; }
  .coin-icon::after { content: "₩"; font: 900 17px/1 var(--font); color: rgba(120,70,0,.75); }
  .wallet .amt { font: 900 30px/1 var(--font); letter-spacing: -.04em; color: var(--gold-2); text-shadow: 0 0 22px rgba(255,207,90,.45); font-variant-numeric: tabular-nums; }
  .wallet .unit { font-size: 12px; font-weight: 700; color: var(--gold); margin-left: 4px; }
  .wallet .sub { margin-top: 5px; display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 999px; background: var(--glass-hi); border: 1px solid var(--stroke); color: var(--muted); }
  .chip.gold { color: var(--gold-2); border-color: rgba(255,207,90,.35); background: rgba(255,207,90,.08); }
  .chip.pulse { animation: chipPulse 1.4s ease-in-out infinite; }
  @keyframes chipPulse { 50% { box-shadow: 0 0 0 4px rgba(255,207,90,.12); } }
  .wallet.bump .amt { animation: bump .5s cubic-bezier(.2,1.6,.4,1); }
  @keyframes bump { 40% { transform: scale(1.14); } }

  .hud-r { position: absolute; top: calc(14px + var(--safe-t)); right: calc(14px + var(--safe-r)); display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
  .bar { display: flex; gap: 8px; align-items: center; }
  .pill { pointer-events: auto; height: 42px; padding: 0 14px; display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; border-radius: 999px; }
  .btn { pointer-events: auto; height: 42px; padding: 0 16px; border-radius: 999px; display: inline-flex; align-items: center; gap: 8px; font-weight: 800; font-size: 14px; letter-spacing: -.02em; transition: transform .15s, box-shadow .2s, filter .2s; white-space: nowrap; }
  .btn:active { transform: translateY(1px) scale(.98); }
  .btn.primary { color: #fff; background: linear-gradient(135deg, #ff3d9a, #ff6a3d); box-shadow: 0 10px 26px -10px rgba(255,61,154,.85), inset 0 1px 0 rgba(255,255,255,.35); }
  .btn.primary:hover { filter: brightness(1.08); box-shadow: 0 14px 30px -10px rgba(255,61,154,.95), inset 0 1px 0 rgba(255,255,255,.35); }
  .btn.gold { color: #2a1800; background: linear-gradient(135deg, #ffe9a8, #ffcf5a 45%, #e6a52a); box-shadow: 0 10px 26px -12px rgba(255,190,60,.9), inset 0 1px 0 rgba(255,255,255,.6); }
  .btn.ghost { background: var(--glass); border: 1px solid var(--stroke); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); color: var(--text); }
  .btn.ghost:hover { border-color: var(--stroke-hi); }
  .btn.icon { width: 42px; padding: 0; justify-content: center; font-size: 17px; }
  .btn:disabled { opacity: .45; cursor: not-allowed; filter: grayscale(.4); }

  .minimap { pointer-events: auto; width: 184px; height: 184px; padding: 8px; position: relative; cursor: zoom-in; transition: border-color .2s, transform .2s; }
  .minimap:hover { border-color: var(--stroke-hi); transform: scale(1.02); }
  .minimap canvas { width: 100%; height: 100%; display: block; border-radius: 12px; }
  .minimap .tag { position: absolute; left: 14px; top: 12px; font: 800 10px/1 var(--font); letter-spacing: .14em; color: var(--muted); }
  .minimap .zoom { position: absolute; right: 13px; bottom: 11px; font-size: 14px; color: var(--muted); }
  .locpill { margin-top: 8px; max-width: 184px; display: flex; align-items: center; gap: 6px; padding: 7px 11px; border-radius: 999px; font-size: 12px; font-weight: 800; color: var(--text); white-space: nowrap; overflow: hidden; }
  .locpill i { font-style: normal; font-size: 12px; }
  .locpill span { overflow: hidden; text-overflow: ellipsis; }

  /* ---------- taxi HUD / waypoint ---------- */
  .taxihud { position: absolute; left: 50%; bottom: calc(18px + var(--safe-b)); transform: translateX(-50%); display: grid; grid-template-columns: auto auto 1fr; grid-template-rows: auto auto; gap: 6px 18px; align-items: center; padding: 12px 18px; min-width: min(560px, calc(100vw - 24px)); pointer-events: auto !important; }
  .taxihud .spd { display: flex; align-items: baseline; gap: 4px; }
  .taxihud .spd b { font: 900 40px/1 var(--font); letter-spacing: -.04em; color: #fff; min-width: 2.2ch; text-align: right; }
  .taxihud .spd span { font-size: 12px; font-weight: 800; color: var(--muted); }
  .taxihud .meter { padding: 6px 10px; border-radius: 10px; background: #0b0b08; border: 1px solid rgba(255,194,26,.4); box-shadow: inset 0 0 12px rgba(255,194,26,.15); }
  .taxihud .meter small { display: block; font: 800 8px/1 var(--font); letter-spacing: .16em; color: #b98a12; }
  .taxihud .meter b { display: block; margin-top: 3px; font: 900 18px/1 "Courier New", monospace; color: #ffc21a; text-shadow: 0 0 8px rgba(255,194,26,.6); }
  .taxihud .job { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .taxihud .job .arrow, .waypill .arrow { display: inline-block; font-style: normal; font-size: 22px; color: #39f58a; transition: transform .15s linear; text-shadow: 0 0 12px currentColor; }
  .taxihud .job small { display: block; font-size: 12px; font-weight: 800; color: var(--muted); white-space: nowrap; }
  .taxihud .job b { display: block; font-size: 20px; font-weight: 900; }
  .taxihud .job .time { margin-left: auto; font: 900 20px/1 var(--font); color: var(--gold-2); }
  .taxihud .job .time.low { color: #ff6b81; animation: chipPulse .6s infinite; }
  .taxihud .keys { grid-column: 1 / -1; font-size: 11px; font-weight: 700; color: var(--dim); text-align: center; }
  .waypill { position: absolute; left: 50%; top: calc(88px + var(--safe-t)); transform: translateX(-50%); display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 14px; border-radius: 999px; font-size: 14px; font-weight: 800; pointer-events: auto !important; }
  .waypill .arrow { font-size: 17px; color: var(--cyan); }
  .waypill small { color: var(--dim); font-size: 11px; margin-left: 2px; }

  /* ---------- rhythm game ---------- */
  .rhythm { position: absolute; left: 50%; bottom: calc(18px + var(--safe-b)); width: min(520px, calc(100% - 24px)); transform: translate(-50%, 24px); opacity: 0; transition: all .35s cubic-bezier(.16,1,.3,1); padding: 14px 16px 12px; pointer-events: none !important; }
  .rhythm.show { transform: translate(-50%, 0); opacity: 1; pointer-events: auto !important; }
  .rhythm header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .rhythm h3 { margin: 0; font: 900 19px/1.1 var(--font); letter-spacing: -.02em; color: #ff7ac0; text-shadow: 0 0 18px rgba(255,61,154,.6); }
  .rhythm .acc { display: flex; align-items: baseline; gap: 10px; }
  .rhythm .acc b { font: 900 22px/1 var(--font); color: var(--gold-2); }
  .rhythm .acc span { font: 900 13px/1 var(--font); color: var(--cyan); letter-spacing: .06em; }
  .rhythm canvas { width: 100%; aspect-ratio: 960 / 560; display: block; border-radius: 12px; background: linear-gradient(180deg, rgba(10,6,26,.9), rgba(30,8,40,.85)); }
  .rhythm .hint { margin: 8px 0 0; text-align: center; font-size: 12px; font-weight: 700; color: var(--muted); }
  .rhythm .pads { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 10px; }
  .rhythm .pads button { height: 64px; border-radius: 14px; font-size: 28px; font-weight: 900; color: #fff; background: var(--glass-hi); border: 1px solid var(--stroke-hi); touch-action: manipulation; }
  .rhythm .pads button:active { background: rgba(255,61,154,.35); }

  /* ---------- full map / settings ---------- */
  .sheet.map { width: min(1180px, 100%); }
  .bigmap { position: relative; width: 100%; height: min(70vh, 760px); border-radius: 16px; overflow: hidden; border: 1px solid var(--stroke); background: #121624; }
  .bigmap canvas { width: 100%; height: 100%; display: block; cursor: crosshair; touch-action: none; }
  .mapzoom { position: absolute; right: 12px; top: 12px; display: flex; flex-direction: column; gap: 6px; }
  .mapzoom button { width: 40px; height: 40px; border-radius: 12px; font-size: 16px; font-weight: 900; color: var(--text); background: rgba(10,13,30,.82); border: 1px solid var(--stroke-hi); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); }
  .mapzoom button:last-child { font-size: 11px; }
  .legend { display: flex; flex-wrap: wrap; gap: 8px 16px; margin-top: 12px; font-size: 12px; font-weight: 700; color: var(--muted); align-items: center; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
  .legend .tip { margin-left: auto; color: var(--dim); }
  .legend .osm { color: var(--dim); font-size: 11px; text-decoration: none; }
  .quick { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 10px; scrollbar-width: none; }
  .quick::-webkit-scrollbar { display: none; }
  .quick button { flex: none; height: 32px; padding: 0 12px; border-radius: 999px; font-size: 12px; font-weight: 800; color: var(--text); background: var(--glass-hi); border: 1px solid var(--stroke); white-space: nowrap; }
  .quick button:hover { border-color: rgba(63,230,255,.6); color: #bff6ff; }
  .place { margin: 4px 0 12px; padding: 12px 14px; border-radius: 14px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; background: linear-gradient(135deg, rgba(63,230,255,.12), rgba(63,230,255,.03)); border: 1px solid rgba(63,230,255,.3); }
  .place .where { flex: 1 1 260px; min-width: 0; }
  .place .where b { display: block; font-size: 14px; font-weight: 900; color: #dffaff; }
  .place .where span { display: block; margin-top: 3px; font-size: 12px; font-weight: 700; color: var(--muted); }
  .place .go { display: flex; gap: 6px; flex-wrap: wrap; }
  .place .go .btn { height: 36px; padding: 0 12px; font-size: 13px; }
  .place .mine { flex-basis: 100%; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .place .mine small { font-size: 11px; font-weight: 800; color: var(--gold-2); margin-right: 2px; }
  .chip-btn { height: 30px; padding: 0 10px; border-radius: 999px; font-size: 12px; font-weight: 800; color: var(--gold-2); background: rgba(255,207,90,.1); border: 1px solid rgba(255,207,90,.45); }
  .plot.mine { outline: 2px solid #ffffff; outline-offset: 1px; }
  .plot.mine::after { content: "내 땅"; position: absolute; top: 3px; font-size: 8px; font-weight: 900; color: #fff; }
  .rangerow { display: flex; align-items: center; gap: 14px; }
  .rangerow b { min-width: 48px; text-align: right; font-size: 15px; color: var(--gold-2); }
  .range { flex: 1; -webkit-appearance: none; appearance: none; height: 6px; border-radius: 999px; background: linear-gradient(90deg, var(--magenta), var(--gold)); outline: none; }
  .range::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 4px rgba(255,61,154,.35), 0 4px 10px rgba(0,0,0,.4); cursor: pointer; }
  .range::-moz-range-thumb { width: 22px; height: 22px; border-radius: 50%; background: #fff; border: 0; box-shadow: 0 0 0 4px rgba(255,61,154,.35); cursor: pointer; }
  .linkbtn { color: var(--cyan); font-weight: 800; text-decoration: underline; }

  /* ---------- news ---------- */
  .news { position: absolute; top: calc(14px + var(--safe-t)); left: 50%; width: min(560px, calc(100% - 640px)); min-width: 320px; transform: translate(-50%, calc(-100% - 30px)); transition: transform .55s cubic-bezier(.16,1,.3,1), opacity .3s; opacity: 0; display: flex; align-items: stretch; overflow: hidden; }
  .news.show { transform: translate(-50%, 0); opacity: 1; }
  .news .kick { flex: none; display: grid; place-items: center; padding: 0 14px; font: 900 11px/1.1 var(--font); letter-spacing: .12em; color: #fff; background: linear-gradient(160deg, #ff3b4e, #c2185b); text-align: center; }
  .news .kick b { display: block; font-size: 15px; letter-spacing: 0; }
  .news .body { padding: 11px 16px 12px; min-width: 0; }
  .news .body small { display: block; font-size: 11px; font-weight: 800; color: var(--magenta-2); letter-spacing: .08em; }
  .news .body strong { display: block; margin-top: 3px; font-size: 15px; font-weight: 800; letter-spacing: -.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .news .body em { font-style: normal; color: var(--gold-2); }

  /* ---------- prompt / dock ---------- */
  .prompt { position: absolute; left: 50%; bottom: calc(118px + var(--safe-b)); transform: translate(-50%, 12px) scale(.96); opacity: 0; transition: all .25s cubic-bezier(.2,1.2,.4,1); pointer-events: none !important; }
  .prompt.show { opacity: 1; transform: translate(-50%, 0) scale(1); pointer-events: auto !important; }
  .prompt button { display: flex; align-items: center; gap: 12px; padding: 9px 18px 9px 9px; border-radius: 999px; font-weight: 800; font-size: 15px; letter-spacing: -.02em; }
  .keycap { min-width: 32px; height: 32px; padding: 0 8px; border-radius: 10px; display: inline-grid; place-items: center; font: 900 14px/1 var(--font); color: #2a1800; background: linear-gradient(180deg, #fff3c4, #ffcf5a); box-shadow: 0 3px 0 #b47a12, 0 0 18px rgba(255,207,90,.5); }
  .prompt .sub { font-size: 12px; color: var(--muted); font-weight: 600; }
  .prompt .cool { position: relative; width: 26px; height: 26px; }
  .prompt .cool svg { position: absolute; inset: 0; transform: rotate(-90deg); }

  .dock { position: absolute; left: 50%; bottom: calc(18px + var(--safe-b)); transform: translateX(-50%); display: flex; gap: 8px; padding: 8px; pointer-events: auto !important; }
  .emote { position: relative; width: 74px; height: 70px; border-radius: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; background: var(--glass-hi); border: 1px solid transparent; transition: transform .15s, background .2s, border-color .2s; }
  .emote:hover { background: rgba(255,255,255,.1); border-color: var(--stroke-hi); transform: translateY(-2px); }
  .emote:active { transform: translateY(0) scale(.96); }
  .emote .e { font-size: 26px; line-height: 1; filter: drop-shadow(0 4px 8px rgba(0,0,0,.4)); }
  .emote .l { font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: -.02em; }
  .emote .k { position: absolute; top: 5px; right: 6px; font: 800 9px/1 var(--font); color: var(--dim); }
  .emote.fire { animation: fire .45s ease; }
  @keyframes fire { 30% { transform: translateY(-6px) scale(1.06); background: rgba(255,61,154,.18); } }
  .dock .sep { width: 1px; margin: 8px 2px; background: var(--stroke); }
  .emote.more.on { border-color: rgba(255,207,90,.6); background: rgba(255,207,90,.12); }
  .reacts { position: absolute; left: 50%; bottom: calc(112px + var(--safe-b)); transform: translateX(-50%); display: grid; grid-template-columns: repeat(8, 46px); gap: 6px; padding: 10px; pointer-events: auto !important; animation: fadeIn .2s ease; }
  .reacts button { width: 46px; height: 46px; border-radius: 13px; font-size: 25px; background: var(--glass-hi); border: 1px solid transparent; transition: transform .12s, border-color .2s; }
  .reacts button:hover { transform: translateY(-2px) scale(1.06); border-color: var(--stroke-hi); }

  .help { position: absolute; left: calc(14px + var(--safe-l)); bottom: calc(18px + var(--safe-b)); padding: 10px 12px; display: grid; grid-template-columns: auto auto; gap: 6px 10px; font-size: 12px; color: var(--muted); font-weight: 600; transition: opacity .6s; }
  .help kbd { font: 800 11px/1 var(--font); color: var(--text); padding: 4px 6px; border-radius: 6px; background: rgba(255,255,255,.08); border: 1px solid var(--stroke); box-shadow: 0 2px 0 rgba(0,0,0,.35); }
  .help.fade { opacity: 0; }

  /* ---------- touch controls ---------- */
  .joy { position: absolute; left: calc(22px + var(--safe-l)); bottom: calc(26px + var(--safe-b)); width: 132px; height: 132px; border-radius: 50%; pointer-events: auto !important; touch-action: none;
