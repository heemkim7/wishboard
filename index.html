<style>
  :root {
    --bg: #0a0e1c;
    --surface: #141a2e;
    --surface-hud: rgba(20, 26, 46, .92);
    --surface-2: #1c2440;

    --dim: #666d92;
    --accent: #ffb020;

    --on-accent: #1c1300;
    --accent-weak: rgba(255, 176, 32, .14);
    --live: #ff4fa3;
    --info: #48d6f0;
    --ok: #3ddc97;
    --danger: #ff5d6c;
    /* Low-alpha tints of the named colours, like --accent-weak, for tinted rows and states. */

    --info-weak: rgba(72, 214, 240, .12);
    --ok-weak: rgba(61, 220, 151, .14);

    --shadow-sheet: 0 20px 60px rgba(0,0,0,.5);
    --shadow-pop: 0 8px 24px rgba(0,0,0,.4);
    /* ui.js paints the attendance bars with var(--gold-2); keep the old name pointing at the accent. */
    --gold-2: var(--accent);
    --font: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-l: env(safe-area-inset-left, 0px);
    --safe-r: env(safe-area-inset-right, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  input, textarea, select { user-select: text; -webkit-user-select: text; }
  #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; z-index: 1; }
  #ui { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
  #view, #ui, #boot { top: var(--app-top, 0px); height: var(--app-h, 100dvh); bottom: auto; }
  #ui > * { pointer-events: none; }
  /* The proof bar takes its own taps (an id selector above outranks .proof): its background must not pass a tap on to the
     canvas, which would end the celebration focus, and the manual-copy field inside it must be selectable. */
  #ui > .proof { pointer-events: auto; }
  button, input, select { font-family: inherit; color: inherit; }

  [hidden] { display: none !important; }

  .glass {
    background: var(--surface-hud);
    border: 1px solid var(--line);
    border-radius: 14px;
  }
  .live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); flex: none; }
  .live-dot.warn { background: var(--info); }

  /* ---------- HUD ---------- */
  .hud-l { position: absolute; top: calc(14px + var(--safe-t)); left: calc(14px + var(--safe-l)); display: flex; flex-direction: column; gap: 10px; width: 340px; }
  .ident { display: flex; align-items: stretch; pointer-events: auto; overflow: hidden; padding: 0; }
  .ident .profile { flex: 1; min-width: 0; background: none; border: 0; box-shadow: none; }
  .ident .channel-card { flex: none; display: flex; align-items: center; width: auto; border: 0; border-left: 1px solid var(--line); background: none; border-radius: 0; padding: 8px 10px; white-space: nowrap; }
  .ident .channel-card[hidden] { display: none; }
  .channel-card span { font-size: 12px; font-weight: 700; color: var(--text-2); }
  .fever { pointer-events: auto; padding: 6px 10px; font: 700 12px/1.3 var(--font); }
  button.fever { width: 100%; text-align: left; border: 0; color: inherit; cursor: pointer; }
  /* 밤 9시 banner (ui.js setNine): one thin line in the left column, so it never covers a board or the steal line. */
  button.nine { pointer-events: auto; width: 100%; padding: 6px 10px; border: 1px solid var(--line); color: var(--live); font: 700 12px/1.3 var(--font); text-align: left; cursor: pointer; font-variant-numeric: tabular-nums; }
  button.nine.open { color: var(--bg); border-color: transparent; background: var(--live); }
  button.nine[hidden], #ui.newbie .nine { display: none !important; }
  .liveboard { pointer-events: auto; padding: 10px 12px 8px; display: flex; flex-direction: column; gap: 6px; }
  .liveboard .livehead { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0; background: none; border: 0; color: inherit; font: inherit; cursor: pointer; }
  .liveboard .livehead b { font-size: 12px; letter-spacing: .02em; }

  .liveboard .feedhead { cursor: pointer; margin-top: 2px; }
  .liveboard .rows, .liveboard .feed { display: grid; gap: 2px; }
  .liveboard .rank, .liveboard .f { display: flex; align-items: center; gap: 6px; min-width: 0; font-size: 12px; font-weight: 700; }
  .liveboard .rank .n { width: 16px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .liveboard .rank b, .liveboard .f { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .liveboard .rank .pts { margin-left: auto; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .liveboard .rank.me b { color: var(--info); }
  .liveboard .empty { margin: 0; font-size: 12px; color: var(--muted); font-weight: 500; }
  .liveboard .f { display: block; color: var(--text-2); font-size: 12px; font-weight: 500; line-height: 1.35; }
  .liveboard button.f { width: 100%; text-align: left; background: none; border: 0; padding: 0; font: inherit; color: inherit; cursor: pointer; }
  .liveboard .f b { color: var(--live); font-size: 12px; letter-spacing: .02em; margin-right: 4px; }
  .liveboard .f em { font-style: normal; font-weight: 700; color: var(--text); }
  .liveboard button.rank { width: 100%; background: none; border: 0; color: inherit; font: inherit; text-align: left; cursor: pointer; padding: 0; }
  .liveboard .feed .f:nth-child(n + 4) { display: none; }
  .sheet .content > .btn { margin-top: 10px; }
  .sheet .rank { font-size: 13px; }
  .sheet .rank b { white-space: normal; overflow-wrap: anywhere; font-size: 13px; line-height: 1.35; }
  .sheet, .sheet .content, .sheet .ranks { overflow-x: hidden; max-width: 100%; }

  .sheet .ranks.board .rank { height: auto; min-height: 44px; max-height: none; }
  .profile { pointer-events: auto; display: flex; align-items: center; gap: 12px; padding: 10px 12px; cursor: pointer; transition: border-color .2s, transform .2s; }
  .profile:hover { border-color: var(--line-strong); }
  .avatar { width: 40px; height: 40px; border-radius: 10px; flex: none; position: relative; display: grid; place-items: center; font-size: 20px;
    background: var(--me, var(--live)); }
  .profile .who { min-width: 0; flex: 1; }
  .profile .name { font-weight: 800; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 6px; }
  .profile .name small { font-size: 12px; font-weight: 700; color: var(--muted); }
  .profile .status { margin-top: 3px; display: flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 500; color: var(--muted); }

  .verified { flex: none; display: inline-flex; align-items: center; justify-content: center; min-width: 16px; height: 16px; margin-left: 4px; padding: 0 4px; border-radius: 999px; background: var(--ok); color: var(--bg); font: 800 11px/1 var(--font); font-style: normal; }
  .profile .name .verified { margin-left: 6px; }
  .guestwarn { pointer-events: auto; display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 14px; background: var(--surface-hud); border: 1px solid var(--line); }
  .guestwarn p { margin: 0; flex: 1; font-size: 12px; font-weight: 700; line-height: 1.35; color: var(--danger); }
  .guestwarn .btn { height: 32px; padding: 0 10px; font-size: 13px; white-space: nowrap; }
  .agree { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; font-weight: 500; line-height: 1.45; color: var(--muted); }
  .agree input { margin-top: 3px; }
  .agree a, .note.legal a { color: var(--info); font-weight: 700; }
  /* Account: login sheet (Google first, 또는, id form), policy text unfolded in place, settings account block, withdrawal step. */
  .modal.front { z-index: 60; }
  .login-google { width: 100%; height: 48px; justify-content: center; font-size: 15px; }

  .acct > .btn { width: 100%; justify-content: center; }
  .acct .note { margin-top: 0; }
  .acct-ask { width: 100%; display: grid; gap: 10px; }
  .acct-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .acct-row .btn { justify-content: center; }
  .gone-warn, .btn.gone-go:not(:disabled) { color: var(--danger); }

  .btn.gone-go { width: 100%; justify-content: center; }
  #boot .boot-login { min-height: 40px; font-size: 13px; color: var(--text-2); }

  .policydoc article { max-width: 720px; margin: 0 auto; font: 500 15px/1.7 var(--font); }
  .policydoc h1 { margin: 0 0 12px; font: 800 28px/1.25 var(--font); letter-spacing: -.01em; }
  .policydoc h2 { margin: 28px 0 8px; font: 800 17px/1.4 var(--font); letter-spacing: -.01em; }
  .policydoc a { color: var(--info); font-weight: 700; }
  html.touch .hud-l .guestwarn { position: absolute; top: calc(100% + 6px); left: 0; width: min(300px, calc(100vw - 20px)); z-index: 6; }

  .wallet { pointer-events: auto; padding: 12px 14px 12px 12px; display: flex; align-items: center; gap: 12px; position: relative; overflow: hidden; }
  /* The text column may shrink below its longest line, so the chips and the next-goal line stay inside the panel. */
  .wallet > div:last-child { min-width: 0; }
  .coin-icon { width: 38px; height: 38px; border-radius: 50%; flex: none; position: relative; overflow: hidden;
    background: var(--accent); }
  .coin-icon img { width: 148%; height: 148%; margin: -24%; display: block; object-fit: cover; filter: brightness(1.35) saturate(1.3); }
  .coin-icon::after { content: none; }
  .wallet .amt { font: 800 20px/1 var(--font); letter-spacing: -.01em; color: var(--accent); font-variant-numeric: tabular-nums; }
  .wallet .unit { font-size: 12px; font-weight: 700; color: var(--muted); margin-left: 4px; }
  .wallet .sub { margin-top: 5px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .wallet .sub-fixed, .wallet .sub-live { display: inline-flex; gap: 6px; align-items: center; min-width: 0; }
  .wallet .sub-fixed { flex: none; }
  .wallet .sub-live { margin-left: auto; }
  .nextgoal { position: relative; flex: 1 0 100%; font: inherit; font-size: 12px; font-weight: 700; line-height: 1.35; color: var(--info); background: none; border: 0; padding: 0; text-align: left; cursor: pointer; overflow-wrap: anywhere; }
  .nextline { margin: 0; padding: 8px 10px; border-radius: 14px; background: var(--surface-hud); border: 1px solid var(--line); color: var(--text); font: 700 13px/1.35 var(--font); pointer-events: auto; }
  .nextline .chip { pointer-events: auto; }
  .wallet .protect { position: relative; font: inherit; font-size: 12px; font-weight: 700; color: var(--muted); white-space: nowrap; background: none; border: 0; padding: 0; cursor: pointer; }
  .chip { display: inline-flex; align-items: center; gap: 6px; min-height: 28px; font-size: 12px; font-weight: 700; padding: 0 10px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); color: var(--text-2); }
  .chip.gold { color: var(--accent); background: var(--accent-weak); }
  .attend-week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin: 4px 0 12px; }
  .attend-day { display: grid; place-items: center; height: 36px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); font-weight: 800; color: var(--muted); }
  .attend-day.on { background: var(--accent-weak); color: var(--accent); }
  .chip.pulse { animation: chipPulse 1.4s ease-in-out infinite; }
  @keyframes chipPulse { 50% { opacity: .6; } }
  .wallet.bump .amt { animation: bump .5s cubic-bezier(.2,1.6,.4,1); }
  @keyframes bump { 40% { transform: scale(1.14); } }

  .hud-r { position: absolute; top: calc(14px + var(--safe-t)); right: calc(14px + var(--safe-r)); display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
  .bar { display: flex; gap: 8px; align-items: center; }
  .tools { pointer-events: auto; display: flex; align-items: center; height: 46px; padding: 0 4px; border-radius: 999px; }
  .btn { pointer-events: auto; height: 42px; padding: 0 16px; border-radius: 10px; display: inline-flex; align-items: center; gap: 6px; font-weight: 700; font-size: 15px; color: var(--text); background: var(--surface-2); border: 1px solid var(--line); transition: transform .15s, background-color .2s, border-color .2s; white-space: nowrap; }
  .btn:active { transform: translateY(1px) scale(.98); }
  .btn.primary { color: var(--on-accent); background: var(--accent); border-color: transparent; }
  .btn.primary:hover { filter: brightness(1.06); }
  .btn.gold { color: var(--on-accent); background: var(--accent); border-color: transparent; }
  .btn.primary:active, .btn.gold:active { filter: none; background: var(--accent-press); }
  .btn.ghost { background: var(--surface-2); border: 1px solid var(--line); color: var(--text); }
  .btn.ghost:hover { border-color: var(--line-strong); }
  .btn.icon { width: 42px; padding: 0; justify-content: center; font-size: 17px; }
  .tools .btn, .tools .btn.ghost, .tools .btn.icon { width: 40px; height: 40px; padding: 0; border: 0; border-radius: 50%; background: transparent; color: var(--text); font-size: 20px; }
  .tools .btn:hover, .tools .btn.ghost:hover { background: var(--surface-2); border-color: transparent; }
  .channel-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .btn:disabled { cursor: not-allowed; color: var(--dim); background: var(--surface-2); border-color: var(--line); filter: none; }

  .minimap { pointer-events: auto; width: 184px; height: 184px; padding: 8px; position: relative; cursor: zoom-in; transition: border-color .2s, transform .2s; }
  .minimap:hover { border-color: var(--line-strong); transform: scale(1.02); }

  .minimap .zoom { position: absolute; right: 13px; bottom: 11px; font-size: 13px; color: var(--muted); }
  .locpill { margin-top: 8px; max-width: 184px; display: flex; align-items: center; gap: 6px; padding: 7px 11px; border-radius: 999px; font-size: 12px; font-weight: 700; color: var(--text); white-space: nowrap; overflow: hidden; }
  .locpill i { flex: none; font-style: normal; font-size: 12px; }
  .locpill span { min-width: 0; overflow: hidden; text-overflow: ellipsis; }

  /* ---------- taxi HUD / waypoint ---------- */
  .taxihud { position: absolute; left: 50%; bottom: calc(18px + var(--safe-b)); transform: translateX(-50%); display: grid; grid-template-columns: auto auto 1fr; grid-template-rows: auto auto; gap: 6px 18px; align-items: center; padding: 12px 18px; min-width: min(560px, calc(100vw - 24px)); pointer-events: auto !important; }
  .taxihud .spd { display: flex; align-items: baseline; gap: 4px; }
  .taxihud .spd b { font: 800 28px/1 var(--font); letter-spacing: -.01em; color: var(--text); min-width: 2.2ch; text-align: right; font-variant-numeric: tabular-nums; }
  .taxihud .spd span { font-size: 12px; font-weight: 700; color: var(--muted); }
  .taxihud .meter { padding: 6px 10px; border-radius: 10px; background: var(--bg); border: 1px solid var(--line); }
  .taxihud .meter small { display: block; font: 700 12px/1 var(--font); letter-spacing: .04em; color: var(--muted); }
  .taxihud .meter b { display: block; margin-top: 3px; font: 800 17px/1 var(--font); color: var(--accent); font-variant-numeric: tabular-nums; }
  .taxihud .job { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .taxihud .job .arrow, .waypill .arrow { display: inline-block; font-style: normal; font-size: 20px; color: var(--info); transition: transform .15s linear; }
  .taxihud .job small { display: block; font-size: 12px; font-weight: 700; color: var(--muted); white-space: nowrap; }
  .taxihud .job b { display: block; font-size: 20px; font-weight: 800; }
  .taxihud .job .time { margin-left: auto; font: 800 20px/1 var(--font); color: var(--text); font-variant-numeric: tabular-nums; }
  .taxihud .job .time.low { color: var(--danger); animation: chipPulse .6s infinite; }
  .taxihud .keys { grid-column: 1 / -1; font-size: 12px; font-weight: 500; color: var(--muted); text-align: center; }
  .waypill { position: absolute; left: 50%; top: calc(88px + var(--safe-t)); transform: translateX(-50%); display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 14px; border-radius: 999px; font-size: 13px; font-weight: 700; color: var(--info); pointer-events: auto !important; }
  .waypill .arrow { font-size: 17px; color: var(--info); }
  .waypill small { color: var(--muted); font-size: 12px; margin-left: 2px; }
  .taxihud .job small { white-space: normal; }
  .taxihud .job.talk small { color: var(--text); font-size: 15px; line-height: 1.35; }
  #ui > .sponsor { pointer-events: auto; position: absolute; left: 50%; bottom: calc(128px + var(--safe-b)); transform: translateX(-50%); width: min(520px, calc(100% - 24px)); padding: 14px 16px 12px; z-index: 8; }
  .sponsor h3 { margin: 0; font: 800 17px/1.3 var(--font); letter-spacing: -.01em; }
  .sponsor p { margin: 6px 0 0; font-size: 13px; font-weight: 500; line-height: 1.45; }
  .sponsor .gold { display: block; margin-top: 8px; color: var(--accent); }
  .sponsor h3, .sponsor p { overflow-wrap: anywhere; }
  .sponsor .input { width: 100%; margin-top: 8px; }
  .sponsor .row { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; position: static; width: auto; height: auto; }
  .sponsor .row .btn { width: 100%; height: 44px; border-radius: 10px; justify-content: center; white-space: nowrap; }
  html.touch #ui > .sponsor { bottom: calc(148px + var(--safe-b)); width: min(420px, calc(100% - 16px)); }
  .act.boost { font-size: 20px; color: var(--text); background: var(--surface-hud); }

  /* ---------- rhythm game ---------- */
  .rhythm, .rhythm * { pointer-events: none !important; }
  .rhythm { position: absolute; left: 50%; bottom: calc(18px + var(--safe-b)); width: min(520px, calc(100% - 24px)); transform: translate(-50%, 24px); opacity: 0; transition: all .35s cubic-bezier(.16,1,.3,1); padding: 14px 16px 12px; }
  .rhythm.show, .rhythm.show * { pointer-events: auto !important; }
  .rhythm.show { transform: translate(-50%, 0); opacity: 1; }
  .rhythm header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .rhythm h3 { margin: 0; font: 800 17px/1.1 var(--font); letter-spacing: -.01em; color: var(--text); }
  .rhythm .acc { display: flex; align-items: baseline; gap: 10px; }
  .rhythm .acc b { font: 800 20px/1 var(--font); color: var(--text); font-variant-numeric: tabular-nums; }
  .rhythm .acc span { font: 800 13px/1 var(--font); color: var(--info); letter-spacing: .04em; }
  .rhythm canvas { width: 100%; aspect-ratio: 960 / 560; display: block; border-radius: 10px; background: var(--bg); }
  .rhythm .hint { margin: 8px 0 0; text-align: center; font-size: 12px; font-weight: 500; color: var(--muted); }
  .rhythm .pads { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 10px; }
  .rhythm .pads button { height: 64px; border-radius: 14px; font-size: 28px; font-weight: 800; color: var(--text); background: var(--surface-2); border: 1px solid var(--line); touch-action: manipulation; }
  .rhythm .pads button:active { background: var(--live-weak); border-color: var(--line-strong); }

  /* ---------- full map / settings ---------- */
  .sheet.map { width: min(1180px, 100%); }
  .bigmap { position: relative; width: 100%; height: min(70vh, 760px); border-radius: 14px; overflow: hidden; border: 1px solid var(--line); background: var(--bg); }
  .bigmap canvas { width: 100%; height: 100%; display: block; cursor: crosshair; touch-action: none; }
  .mapzoom { position: absolute; right: 12px; top: 12px; display: flex; flex-direction: column; gap: 6px; }
  .mapzoom button { width: 40px; height: 40px; border-radius: 10px; font-size: 15px; font-weight: 800; color: var(--text); background: var(--surface-hud); border: 1px solid var(--line); }
  .mapzoom button:last-child { font-size: 12px; }
  .legend { display: flex; flex-wrap: wrap; gap: 8px 16px; margin-top: 12px; font-size: 12px; font-weight: 700; color: var(--muted); align-items: center; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
  .legend .tip { margin-left: auto; color: var(--muted); }
  .legend .osm { color: var(--muted); font-size: 12px; text-decoration: none; }
  .quick { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 10px; scrollbar-width: none; }
  .quick::-webkit-scrollbar { display: none; }
  .quick button { position: relative; flex: none; height: 32px; padding: 0 12px; border-radius: 999px; font-size: 12px; font-weight: 700; color: var(--text-2); background: var(--surface-2); border: 1px solid var(--line); white-space: nowrap; }
  .quick button:hover { border-color: var(--line-strong); color: var(--text); }
  .place { margin: 4px 0 12px; padding: 12px 14px; border-radius: 14px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; background: var(--surface-2); border: 1px solid var(--line); }
  .place .where { flex: 1 1 260px; min-width: 0; }
  .place .where b { display: block; font-size: 15px; font-weight: 800; color: var(--text); }
  .place .where span { display: block; margin-top: 3px; font-size: 12px; font-weight: 500; color: var(--muted); }
  .place .go { display: flex; gap: 6px; flex-wrap: wrap; }
  .place .go .btn { height: 36px; padding: 0 12px; font-size: 13px; }
  .place .mine { flex-basis: 100%; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .place .mine small { font-size: 12px; font-weight: 700; color: var(--muted); margin-right: 2px; }
  .chip-btn { height: 30px; padding: 0 10px; border-radius: 999px; font-size: 12px; font-weight: 700; color: var(--text-2); background: var(--surface-2); border: 1px solid var(--line); }
  .plot.mine { outline: 2px solid var(--text); outline-offset: 1px; }
  .plot.mine::after { content: "내 땅"; position: absolute; top: 3px; font-size: 12px; font-weight: 800; color: var(--text); }
  .rangerow { display: flex; align-items: center; gap: 14px; }
  .rangerow b { min-width: 48px; text-align: right; font-size: 15px; color: var(--text); font-variant-numeric: tabular-nums; }
  .range { flex: 1; -webkit-appearance: none; appearance: none; height: 6px; border-radius: 999px; background: var(--line-strong); outline: none; }
  .range::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%; background: var(--text); cursor: pointer; }
  .range::-moz-range-thumb { width: 22px; height: 22px; border-radius: 50%; background: var(--text); border: 0; cursor: pointer; }
  .linkbtn { position: relative; color: var(--info); font-weight: 700; text-decoration: underline; }

  /* ---------- news ---------- */
  .news { position: absolute; top: calc(68px + var(--safe-t)); left: 50%; height: 46px; width: min(440px, calc(100vw - 780px)); min-width: 0; transform: translate(-50%, calc(-100% - 30px)); transition: transform .55s cubic-bezier(.16,1,.3,1), opacity .3s; opacity: 0; display: flex; align-items: stretch; overflow: hidden; pointer-events: none; }
  .news.show { transform: translate(-50%, 0); opacity: 1; }
  #ui > .news.show.go { pointer-events: auto; cursor: pointer; }
  .news .kick { flex: none; display: grid; place-items: center; padding: 0 14px; font: 800 12px/1.1 var(--font); letter-spacing: .04em; color: var(--bg); background: var(--live); text-align: center; }
  .news .kick b { display: block; font-size: 15px; letter-spacing: 0; }
  /* Centred in the fixed-height bar, so the two lines never run past its bottom edge. */
  .news .body { padding: 0 16px; min-width: 0; display: flex; flex-direction: column; justify-content: center; }
  .news .body small { display: block; font-size: 12px; font-weight: 700; line-height: 1.2; color: var(--live); letter-spacing: .04em; }
  .news .body strong { display: block; margin-top: 3px; font-size: 15px; font-weight: 500; line-height: 1.2; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .news .body em { font-style: normal; font-weight: 700; color: var(--text); }

  /* ---------- prompt / dock ---------- */
  .prompt { position: absolute; left: 50%; bottom: calc(118px + var(--safe-b)); transform: translate(-50%, 12px) scale(.96); opacity: 0; transition: all .25s cubic-bezier(.2,1.2,.4,1); pointer-events: none !important; }
  .prompt.show { opacity: 1; transform: translate(-50%, 0) scale(1); pointer-events: auto !important; }
  .prompt button { display: flex; align-items: center; gap: 12px; padding: 9px 18px 9px 9px; border-radius: 999px; font-weight: 700; font-size: 15px; max-width: min(520px, calc(100vw - 24px)); }
  .prompt button > span { white-space: normal; }
  .keycap { min-width: 32px; height: 32px; padding: 0 8px; border-radius: 10px; display: inline-grid; place-items: center; font: 800 13px/1 var(--font); color: var(--text); background: var(--surface-2); border: 1px solid var(--line-strong); }
  .prompt .sub { font-size: 12px; color: var(--muted); font-weight: 500; }
  .prompt .cool { position: relative; width: 26px; height: 26px; }
  .prompt .cool svg { position: absolute; inset: 0; transform: rotate(-90deg); }
  /* A tap on a far board: a small card above the prompt, never a sheet. ui.js showFarCard removes it after 4 s. */
  .farcard { position: absolute; left: 50%; bottom: calc(176px + var(--safe-b)); transform: translate(-50%, 8px); z-index: 6; display: flex; align-items: center; gap: 12px; max-width: calc(100vw - 24px); padding: 10px 12px; border-radius: 14px; background: var(--surface-hud); border: 1px solid var(--line); color: var(--text); opacity: 0; transition: opacity .25s ease, transform .25s ease; pointer-events: none !important; }
  .farcard.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto !important; }
  .farcard .where { display: grid; gap: 2px; min-width: 0; }
  .farcard .where b { font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .farcard .where span { font-size: 12px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* The card's own button row is .far-acts: the touch controls' .acts rules (absolute, bottom right, no pointer events) must never match it. */
  .farcard .far-acts { display: flex; flex-direction: row; align-items: center; gap: 6px; flex: none; pointer-events: auto; }
  .farcard .far-acts button { min-height: 40px; padding: 0 12px; border-radius: 14px; border: 1px solid var(--line); background: transparent; color: var(--text); font-size: 13px; font-weight: 700; white-space: nowrap; }
  .farcard .far-acts button.go { border-color: var(--accent); color: var(--accent); }
  .farcard .far-acts button:disabled { color: var(--text-2); opacity: .5; }
  html.touch .farcard .far-acts button { min-width: 44px; min-height: 44px; }

  .dock { position: absolute; left: 50%; bottom: calc(18px + var(--safe-b)); transform: translateX(-50%); display: flex; gap: 8px; padding: 8px; pointer-events: auto !important; }
  .emote { position: relative; width: 74px; height: 70px; border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: var(--text); background: var(--surface-2); border: 1px solid transparent; transition: transform .15s, background .2s, border-color .2s; }
  .emote:hover { border-color: var(--line-strong); transform: translateY(-2px); }
  .emote:active { transform: translateY(0) scale(.96); }
  .emote .e { font-size: 28px; line-height: 1; }
  .emote .l { font-size: 12px; font-weight: 700; color: var(--text-2); }
  .emote .k { position: absolute; top: 5px; right: 6px; font: 700 11px/1 var(--font); color: var(--muted); }
  .emote.fire { animation: fire .45s ease; }
  @keyframes fire { 30% { transform: translateY(-6px) scale(1.06); background: var(--line-strong); } }
  .dock .sep { width: 1px; margin: 8px 2px; background: var(--line); }
  .emote.more.on { border-color: var(--line-strong); background: var(--accent-weak); color: var(--accent); }
  .reacts { position: absolute; left: 50%; bottom: calc(112px + var(--safe-b)); transform: translateX(-50%); display: grid; grid-template-columns: repeat(8, 46px); gap: 6px; padding: 10px; pointer-events: auto !important; animation: fadeIn .2s ease; box-shadow: var(--shadow-pop); }
  @keyframes fadeIn { from { opacity: 0; } }
  .reacts button { width: 46px; height: 46px; border-radius: 10px; font-size: 28px; background: var(--surface-2); border: 1px solid transparent; transition: transform .12s, border-color .2s; }
  .reacts button:hover { transform: translateY(-2px) scale(1.06); border-color: var(--line-strong); }

  .help { position: absolute; left: calc(14px + var(--safe-l)); bottom: calc(18px + var(--safe-b)); padding: 10px 12px; display: grid; grid-template-columns: auto auto; gap: 6px 10px; font-size: 12px; color: var(--muted); font-weight: 500; transition: opacity .6s; }
  .help kbd { font: 700 12px/1 var(--font); color: var(--text); padding: 4px 6px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); }
  .help.fade { opacity: 0; }

  /* ---------- touch controls ---------- */
  .joy { position: absolute; left: calc(22px + var(--safe-l)); bottom: calc(26px + var(--safe-b)); width: 132px; height: 132px; border-radius: 50%; pointer-events: auto !important; touch-action: none;
    background: var(--surface-hud); border: 1px solid var(--line); }
  .joy::before { content: ""; position: absolute; inset: 22px; border-radius: 50%; border: 1px dashed var(--line-strong); }
  .joy .knob { position: absolute; left: 50%; top: 50%; width: 56px; height: 56px; margin: -28px 0 0 -28px; border-radius: 50%; background: var(--text-2); transition: transform .08s; }
  .acts { position: absolute; right: calc(20px + var(--safe-r)); bottom: calc(28px + var(--safe-b)); display: flex; flex-direction: column; align-items: flex-end; gap: 12px; pointer-events: none; }
  .act { pointer-events: auto; width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; font-size: 20px; color: var(--text); background: var(--surface-hud); border: 1px solid var(--line); touch-action: manipulation; }
  .act.big { width: 84px; height: 84px; font-size: 15px; font-weight: 800; line-height: 1.1; text-align: center; color: var(--on-accent); background: var(--accent); border-color: transparent; }
  .act.jump { font-size: 28px; font-weight: 700; color: var(--text); background: var(--surface-hud); }
  /* Floating stick (ui.js joyZone, interact.js STICK_*): the lower-left area takes the touch and sits under the rest of
     the HUD; the stick is only a picture, resting faint until a thumb drags, then centred where it went down. */
  #ui > .joyzone { position: absolute; left: 0; bottom: 0; z-index: 0; pointer-events: auto; touch-action: none; }
  html.touch #ui > .joy { pointer-events: none !important; opacity: .5; transition: opacity .15s; }
  html.touch #ui > .joy.live { opacity: 1; }
  .joy.live .knob { transition: none; }
  .act.jump.honk { font-size: 15px; font-weight: 800; }
  .coach { position: absolute; left: 50%; top: calc(172px + var(--safe-t)); transform: translateX(-50%); max-width: calc(100vw - 32px); padding: 8px 14px; border-radius: 999px; background: var(--surface-hud); border: 1px solid var(--line); color: var(--text); font: 700 13px/1.35 var(--font); text-align: center; pointer-events: none; z-index: 4; }
  /* Touch (the only place it is shown): at top 172px it lay over the left column (identity, task, wallet). It sits in the
     lower middle instead: above the resting stick (ends 140px up) and the waypoint pill (ends 180px up), under the toasts
     (from 228px), and it stops 76px from the right edge, where the dock and the action buttons are. */
  html.touch .coach { top: auto; bottom: calc(190px + var(--safe-b)); left: calc(16px + var(--safe-l)); right: calc(76px + var(--safe-r)); width: fit-content; max-width: none; margin: 0 auto; transform: none; padding: 8px 12px; font-size: 12px; }

  /* ---------- bake minigame ---------- */
  .bake, .bake * { pointer-events: none !important; }
  .bake { position: absolute; left: 50%; bottom: calc(112px + var(--safe-b)); width: min(560px, calc(100% - 24px)); transform: translate(-50%, 24px); opacity: 0; transition: all .35s cubic-bezier(.16,1,.3,1); padding: 16px 18px 14px; }
  .bake.show, .bake.show * { pointer-events: auto !important; }
  .bake.show { transform: translate(-50%, 0); opacity: 1; z-index: 9; }
  .rhythm.show { z-index: 9; }
  .bake header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .bake h3 { margin: 0; font: 800 17px/1.1 var(--font); letter-spacing: -.01em; color: var(--text); }
  .bake header span { font-size: 12px; font-weight: 500; color: var(--muted); }
  /* Flat zones: burnt/raw on the surface, GOOD in --ok, GOLD in --accent (the same 38/47/53/62 % stops as before). */
  .gauge { position: relative; margin: 16px 0 10px; height: 46px; border-radius: 10px; overflow: hidden; background: linear-gradient(90deg, var(--surface-2) 0 34%, var(--ok-weak) 34% 38%, var(--ok) 38% 47%, var(--accent) 47% 53%, var(--ok) 53% 62%, var(--ok-weak) 62% 66%, var(--surface-2) 66%); }
  .gauge::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, transparent 0 22px, rgba(0,0,0,.16) 22px 24px); }
  .gauge .lbl { position: absolute; top: 4px; font: 800 12px/1 var(--font); letter-spacing: 0; color: var(--bg); transform: translateX(-50%); z-index: 2; }
  .needle { position: absolute; top: -4px; bottom: -4px; width: 0; z-index: 3; }
  .needle::before { content: ""; position: absolute; left: -3px; top: 0; bottom: 0; width: 6px; border-radius: 999px; background: var(--text); }
  .needle::after { content: "🐟"; position: absolute; left: -11px; top: -26px; font-size: 20px; }
  .bake .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .bake .hint { font-size: 12px; color: var(--muted); font-weight: 500; }
  .bake .stop { height: 44px; padding: 0 22px; font-size: 15px; }
  .result { position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%) scale(.6); opacity: 0; text-align: center; pointer-events: none; transition: none; }
  .countflash { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; pointer-events: none; font: 800 40px/1 var(--font); color: var(--text); text-shadow: 0 2px 12px rgba(0,0,0,.6); }
  .countflash.flash { background: rgba(255,255,255,.72); animation: shotflash .12s linear; }
  @keyframes shotflash { from { opacity: 1; } to { opacity: 0; } }
  .result.go { animation: result 1.4s cubic-bezier(.2,1.2,.3,1) forwards; }
  .result b { display: block; font: 800 28px/1 var(--font); letter-spacing: -.01em; color: var(--accent); text-shadow: 0 2px 12px rgba(0,0,0,.6); }
  .result.miss b { color: var(--danger); }
  .result span { display: block; margin-top: 8px; font-size: 17px; font-weight: 800; color: var(--text); text-shadow: 0 2px 12px rgba(0,0,0,.6); }
  @keyframes result { 0% { opacity: 0; transform: translate(-50%, -50%) scale(.6); } 18% { opacity: 1; transform: translate(-50%, -50%) scale(1.08); } 30% { transform: translate(-50%, -50%) scale(1); } 75% { opacity: 1; transform: translate(-50%, -60%) scale(1); } 100% { opacity: 0; transform: translate(-50%, -80%) scale(.96); } }

  /* ---------- toasts / coins ---------- */
  .toasts { position: fixed; z-index: 70; left: 50%; bottom: calc(196px + var(--safe-b)); transform: translateX(-50%); display: flex; flex-direction: column-reverse; align-items: center; gap: 8px; pointer-events: none; }
  .toast { padding: 10px 16px; font-size: 13px; font-weight: 700; color: var(--text); background: var(--surface-2); border-color: var(--line); border-radius: 10px; box-shadow: var(--shadow-pop); animation: toastIn .35s cubic-bezier(.2,1.2,.4,1); width: max-content; max-width: min(440px, calc(100vw - 24px)); height: auto; white-space: normal; text-align: center; line-height: 1.4; }
  /* The kind is a 6px dot before the text: --info by default, --ok, --danger. */
  .toast::before { content: ""; display: inline-block; width: 6px; height: 6px; margin-right: 8px; border-radius: 50%; background: var(--info); vertical-align: 2px; }
  .toast.hit { pointer-events: auto; cursor: pointer; border-color: var(--line-strong); }
  .toast.err::before { background: var(--danger); }
  .toast.ok::before { background: var(--ok); }
  .toast.out { animation: toastOut .3s ease forwards; }
  /* A tappable toast ends in a chevron. */
  .toast .go { display: inline-block; margin-left: 6px; font-style: normal; color: var(--text-2); }
  .toast .go svg.ico { width: 15px; height: 15px; vertical-align: -3px; }
  /* While a sheet, the proof bar, the bake panel or the dance panel is up the toasts sit at the top: clear of the
     panel's buttons and of the phone keyboard. */
  body.has-sheet .toasts, body.has-proof .toasts, body:has(#ui > .bake.show) .toasts, body:has(#ui > .rhythm.show) .toasts { top: calc(var(--app-top, 0px) + 10px + var(--safe-t)); bottom: auto !important; flex-direction: column; }
  /* Sheets stack: a parent under its child keeps its layout (inputs, scroll) and is only hidden. */
  .modal.under { visibility: hidden; }
  .sheet:focus { outline: none; }
  /* Asked once when a backdrop tap would throw away typing. */
  .sheet-keep { position: sticky; bottom: 0; z-index: 3; flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 18px; font-size: 13px; font-weight: 700; color: var(--text); background: var(--surface-2); border-top: 1px solid var(--line-strong); }
  .sheet-keep span { flex: 1 1 160px; }
  .sheet-keep .btn { height: 44px; }
  /* Proof bar while a 5 s clip records: only the countdown and its cancel. */
  .proof .rec-row { flex: 1 1 100%; display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 15px; color: var(--text); }
  .proof.rec > p, .proof.rec > .btn, .proof.rec > .manual-copy { display: none; }
  /* The lottery strip clips its text in a span, so the strip itself can carry the hit area below. */
  .stay-ticket .t { display: block; overflow: hidden; text-overflow: ellipsis; }
  /* Touch: small controls keep their look and get a larger hit area through ::after (44px tall where the neighbours leave room;
     rows that sit against each other only grow into the gap between them, so no control takes another one's taps). */
  html.touch .x::after, html.touch .guestwarn .btn::after, html.touch .tools:not(.open) .btn::after, html.touch .rank .mini::after,
  html.touch .quick button::after, html.touch .sheet .more .emo-row button::after, html.touch .sheet .more .swatch::after,
  html.touch .stay-ticket::after, html.touch .reacts button::after, html.touch .wallet .chip::after,
  html.touch .wallet .protect::after, html.touch .nextgoal:not(.task)::after, html.touch .linkbtn::after { content: ""; position: absolute; inset: -6px 0; }
  html.touch .x::after { inset: -3px; }
  html.touch .guestwarn .btn::after { inset: -8px -10px -8px -6px; }

  html.touch .sheet button.note { padding: 13px 0; margin-top: 0; }
  /* Desktop news bar placement, on the same columns as the ticker (see the .stay-ticket breakpoints): the left column ends at
     354px, the tool row is the top row (14px … 60px), the minimap column starts 198px from the right. The bar never lies on the
     identity card or the tool row, and never where the ticker is:
     >= 820px   the row under the top bar (68px), centred between the left column and the minimap (378px … right 222px);
                the ticker is in the top row (>= 1090px) or one row further down (134px);
     641-819px  no room in that row: its own row under the right-hand column and the ticker (424px), right-aligned like the ticker;
     <= 640px   along the bottom edge, above the ticker. */
  @media (min-width: 820px) {
    html:not(.touch) .news { top: calc(68px + var(--safe-t)); left: calc(50% + 78px); width: min(440px, calc(100vw - 600px)); }
  }
  @media (min-width: 641px) and (max-width: 819px) {
    html:not(.touch) .news { --news-w: min(320px, calc(100vw - 380px)); top: calc(424px + var(--safe-t)); left: calc(100% - 14px - var(--safe-r) - var(--news-w) / 2); width: var(--news-w); }
  }
  @media (max-width: 640px) {
    html:not(.touch) .news { top: auto; bottom: calc(50px + var(--safe-b)); left: 50%; width: min(440px, calc(100vw - 20px)); }
  }

  /* Like #view and #ui, the modal covers the visible viewport (--app-top / --app-h): with the phone keyboard up the sheet ends above it. */
  .modal { position: fixed; inset: 0; top: var(--app-top, 0px); bottom: auto; height: var(--app-h, 100dvh); z-index: 40; display: grid; place-items: center; padding: max(28px, var(--safe-t)) max(32px, var(--safe-r)) max(28px, var(--safe-b)) max(32px, var(--safe-l)); background: rgba(0,0,0,.64); pointer-events: auto !important; transform: translateZ(0); }
  .sheet { width: min(980px, 100%); max-height: min(88vh, 860px, calc(var(--app-h, 100dvh) - 56px)); overflow: auto; padding: 0; background: var(--surface); border-radius: 20px; box-shadow: var(--shadow-sheet); scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent; }

  .x { position: relative; width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; font-size: 20px; color: var(--text-2); background: var(--surface-2); border: 1px solid var(--line); }
  .x:hover { color: var(--text); border-color: var(--line-strong); }

  .sheet .more .swatch { position: relative; width: 26px; height: 26px; }

  .grid2 { display: grid; grid-template-columns: 1.15fr 1fr; gap: 22px; }
  .sheet.bill { display: flex; flex-direction: column; overflow: hidden; height: min(88vh, 860px, calc(var(--app-h, 100dvh) - 56px)); width: min(1080px, 100%); }
  .sheet.bill > header { flex: none; }
  .sheet.bill > .content { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; }
  .sheet.bill .grid2.bb { flex: 1; min-height: 0; }
  .sheet.bill .grid2.bb > :first-child,
  .sheet.bill .grid2.bb > :last-child { min-height: 0; overflow: auto; }
  /* One column under 900px, scrolling as a whole. Only the preview stays in view while the player types: the first
     column is laid out as if its box were not there (display: contents), so its tabs, slot picker, place card and stats
     scroll away with the form and the sticky preview can follow the whole scroll. (The whole first column used to be
     sticky; it was taller than the scroller, a sticky box that tall never lets go, and the form stayed hidden under it.)
     The preview is compact: at most 28vh tall, centred, on an opaque strip of the sheet's own surface. */
  @media (max-width: 900px) {

  @media (max-width: 900px) and (min-height: 521px) {
